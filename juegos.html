        <button onclick="window.location.href='tortuga.html'" class="text-left block w-full transition-transform hover:scale-105 duration-300 rounded-[2.5rem]"><article class="glass-card rounded-[2.5rem] p-8 flex flex-col items-center text-center h-full aspect-[3/4] justify-between w-full max-w-sm mx-auto"><div class="flex flex-col items-center"><div class="bg-gradient-to-br from-amber-400 to-orange-600 text-white p-5 rounded-3xl mb-6 shadow-md"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></div><h2 class="text-2xl font-extrabold text-gray-900 mb-4 tracking-tight">Tortuga Logic</h2><p id="desc-tortuga" class="text-lg text-gray-700 leading-relaxed font-medium">Sigue el camino correcto entre los cables cruzados antes de que se acabe el tiempo.</p></div><p class="mt-6 text-base text-orange-600 font-bold uppercase tracking-wider btn-play-text">Jugar Ahora</p></article></button>

        <button onclick="window.location.href='match3.html'" class="text-left block w-full transition-transform hover:scale-105 duration-300 rounded-[2.5rem]"><article class="glass-card rounded-[2.5rem] p-8 flex flex-col items-center text-center h-full aspect-[3/4] justify-between w-full max-w-sm mx-auto"><div class="flex flex-col items-center"><div class="bg-gradient-to-br from-purple-500 to-indigo-600 text-white p-5 rounded-3xl mb-6 shadow-md"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></div><h2 class="text-2xl font-extrabold text-gray-900 mb-4 tracking-tight">Neon Match 3</h2><p id="desc-block-match3" class="text-lg text-gray-700 leading-relaxed font-medium">Entrena tu visión espacial alineando gemas y sprites de neón.</p></div><p class="mt-6 text-base text-purple-600 font-bold uppercase tracking-wider btn-play-text">Jugar Ahora</p></article></button>

    <section class="w-full max-w-2xl glass-card rounded-[2.5rem] p-6 mb-16 mx-4">
        <h2 id="board-title" class="text-2xl font-extrabold text-center text-gray-900 mb-6">🏆 RÉCORDS MUNDIALES 🏆</h2>
        <div class="flex justify-center gap-2 mb-6 bg-black/10 p-1.5 rounded-2xl flex-wrap">
            <button id="btn-vibez" onclick="switchLeaderboard('vibez_fly')" class="px-4 py-2 text-sm font-bold rounded-xl bg-pink-600 text-white shadow-md">Vibez Fly</button>
            <button id="btn-memo" onclick="switchLeaderboard('memo')" class="px-4 py-2 text-sm font-bold rounded-xl text-gray-700 hover:bg-white/40">MEMO</button>
            <button id="btn-match3" onclick="switchLeaderboard('match3')" class="px-4 py-2 text-sm font-bold rounded-xl text-gray-700 hover:bg-white/40">MATCH 3</button>
            <button id="btn-dog" onclick="switchLeaderboard('dog_eater')" class="px-4 py-2 text-sm font-bold rounded-xl text-gray-700 hover:bg-white/40">DOG EATER</button>
            <button id="btn-tortuga" onclick="switchLeaderboard('tortuga')" class="px-4 py-2 text-sm font-bold rounded-xl text-gray-700 hover:bg-white/40">TORTUGA</button>
            <button id="btn-block" onclick="switchLeaderboard('block')" class="px-4 py-2 text-sm font-bold rounded-xl text-gray-700 hover:bg-white/40">BLOCK</button>
        </div>
        <div id="leaderboard-rows" class="bg-white/50 rounded-2xl p-4"></div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchLeaderboard = async function(gameId) {
            const rows = document.getElementById('leaderboard-rows');
            rows.innerHTML = "Cargando...";
            const q = query(collection(db, "scores_arcade"), where("game", "==", gameId), orderBy("score", "desc"), limit(10));
            const snapshot = await getDocs(q);
            rows.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                rows.innerHTML += `<div class="flex justify-between p-2 border-b border-black/10"><span>${data.player}</span><span class="font-bold">${data.score}</span></div>`;
            });
        }
        window.switchLeaderboard('vibez_fly');
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Software - Sección de Juegos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fondo oficial de Amy Software con capa de legibilidad */
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)), url('encabezaoAmySoftware.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        /* Tu firma de seguridad: Honeypot invisible para humanos */
        .hp-field { 
            position: absolute; 
            left: -9999px; 
            top: -9999px; 
            width: 1px; 
            height: 1px; 
            overflow: hidden; 
            opacity: 0; 
            pointer-events: none; 
        }
    </style>
</head>
<body class="font-sans text-gray-800 flex flex-col items-center justify-center p-2 sm:p-4">

    <input type="text" id="juegos_frame_hp" class="hp-field" tabindex="-1" autocomplete="off">

    <div id="arcade-main-container" class="w-full max-w-5xl h-[85vh] bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-2xl border border-white/50 flex flex-col overflow-hidden">
        
        <header class="bg-gray-900 text-white px-6 py-4 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl">AS</div>
                <div>
                    <h3 class="font-extrabold text-lg tracking-tight uppercase">Zona Arcade</h3>
                </div>
            </div>
            <a href="index.html" class="px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-xl text-xs font-bold transition-all hover:bg-gray-700 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver al Inicio
            </a>
        </header>

        <div id="arcade-viewport" class="flex-1 bg-slate-950 p-2 sm:p-4 flex items-center justify-center relative">
            
            <iframe src="mi_juego.html" class="w-full h-full rounded-2xl border-0 shadow-inner bg-black" allowfullscreen></iframe>

        </div>
        
        <footer class="px-6 py-3 bg-gray-900 text-gray-400 text-xs text-center font-semibold tracking-wide border-t border-gray-800">
            © 2026 Amy Software - Powered by HTML5 & Jetpack Mindset
        </footer>
    </div>

    <script>
        // Sistema de verificación automática del Honeypot perimetral
        const frameTrap = document.getElementById('juegos_frame_hp');
        const container = document.getElementById('arcade-main-container');

        function checkFrameSecurity() {
            if (frameTrap.value) {
                // Alerta acústica defensiva nativa
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 90;
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } catch(e) {}

                // Bloqueo total de la interfaz del contenedor
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; bg-color:#0f172a; color:#ff0055; font-family:monospace; font-weight:bold; text-align:center; padding:40px;">
                        <h1 style="font-size:24px; margin-bottom:10px;">⚠️ PERÍMETRO COMPROMETIDO ⚠️</h1>
                        <p style="font-size:12px; color:rgba(255,0,85,0.7);">DETECCIÓN DE AGENTE AUTOMATIZADO EXTERNO.<br>LA RECREATIVA HA SIDO APAGADA POR SEGURIDAD.</p>
                        <a href="index.html" style="margin-top:25px; padding:10px 20px; background-color:#ff0055; color:white; font-size:11px; border-radius:8px; text-decoration:none; text-transform:uppercase;">Salir del terminal</a>
                    </div>
                `;
                container.style.backgroundColor = '#020617';
                container.style.borderColor = '#ff0055';
            }
        }

        // Escuchar si un bot lo rellena en tiempo real
        frameTrap.addEventListener('input', checkFrameSecurity);
        // Comprobación inicial rápida
        setInterval(checkFrameSecurity, 1000);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Match 3 - Arcade Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #090d16;
        }
        /* Animación para que las casillas se muevan e intercambien suavemente */
        .grid-cell img {
            transition: transform 0.25s ease-in-out, filter 0.2s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* Resalte neón para la gema seleccionada */
        .selected img {
            filter: drop-shadow(0 0 15px #33ff33) brightness(1.3);
            transform: scale(1.15);
        }
        /* Animación de desaparición cuando explota un Match 3 */
        .match-exploding img {
            transform: scale(0);
            opacity: 0;
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center min-h-screen font-mono p-4">

    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]">
            NEON MATCH 3
        </h1>
        <div class="mt-2 bg-slate-900/80 px-6 py-2 rounded-full border border-slate-800 backdrop-blur-sm shadow-md inline-block">
            <span class="text-gray-400 font-bold uppercase tracking-wider text-sm">Puntos:</span>
            <span id="score-val" class="text-cyan-400 font-black text-xl ml-2">0</span>
        </div>
    </div>

    <div id="tablero" class="grid grid-cols-6 gap-2 bg-slate-900/90 p-3 sm:p-4 rounded-[2rem] border-4 border-slate-800 shadow-[0_0_40px_rgba(0,0,0,0.7)] w-full max-w-[420px] aspect-square">
        </div>

    <script>
        const FILAS = 6;
        const COLUMNAS = 6;
        
        // El set de tus sprites llamativos y llenos de color
        const PIEZAS = [
            { id: 0, nombre: 'estrella', url: 'https://i.postimg.co/N0YtXyYg/star.png' },
            { id: 1, nombre: 'corazon', url: 'https://i.postimg.co/bNJ36zYQ/heart.png' },
            { id: 2, nombre: 'esmeralda', url: 'https://i.postimg.co/g2fXmYmG/emerald.png' },
            { id: 3, nombre: 'galaxia', url: 'https://i.postimg.co/fW0fL6v2/galaxy.png' },
            { id: 4, nombre: 'fuego', url: 'https://i.postimg.co/76bSgYm1/fire.png' },
            { id: 5, nombre: 'rayo', url: 'https://i.postimg.co/vH0XmXyW/lightning.png' }
        ];

        let matriz = [];
        let celdaSeleccionada = null;
        let puntuacion = 0;
        let bloqueado = false; // Evita clics locos mientras caen piezas

        const tablero = document.getElementById('tablero');
        const scoreVal = document.getElementById('score-val');

        // Inicializar
        function crearTablero() {
            tablero.innerHTML = '';
            matriz = [];

            for (let f = 0; f < FILAS; f++) {
                let filaMatriz = [];
                for (let c = 0; c < COLUMNAS; c++) {
                    let pieza;
                    // Bucle para evitar que el tablero empiece con líneas de 3 ya hechas
                    do {
                        pieza = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                    } while (comprobarInicio(f, c, pieza));

                    filaMatriz.push(pieza);

                    const celda = document.createElement('div');
                    celda.id = `celda-${f}-${c}`;
                    celda.dataset.fila = f;
                    celda.dataset.columna = c;
                    celda.className = "grid-cell flex items-center justify-center bg-slate-950/40 border border-slate-800/60 rounded-2xl p-1 cursor-pointer hover:bg-slate-800/30 transition-colors duration-150 aspect-square";
                    celda.innerHTML = `<img src="${pieza.url}" alt="${pieza.nombre}" class="w-full h-full object-contain pointer-events-none">`;
                    celda.addEventListener('click', manejarClic);

                    tablero.appendChild(celda);
                }
                matriz.push(filaMatriz);
            }
        }

        function comprobarInicio(f, c, pieza) {
            if (c >= 2 && matriz[f][c-1].id === pieza.id && matriz[f][c-2].id === pieza.id) return true;
            if (f >= 2 && matriz[f-1][c].id === pieza.id && matriz[f-2][c].id === pieza.id) return true;
            return false;
        }

        function manejarClic(e) {
            if (bloqueado) return;
            const celdaClick = e.currentTarget;
            const f = parseInt(celdaClick.dataset.fila);
            const c = parseInt(celdaClick.dataset.columna);

            if (!celdaSeleccionada) {
                celdaSeleccionada = celdaClick;
                celdaClick.classList.add('selected');
            } else {
                const fAnt = parseInt(celdaSeleccionada.dataset.fila);
                const cAnt = parseInt(celdaSeleccionada.dataset.columna);

                const esAdyacente = (Math.abs(f - fAnt) === 1 && c === cAnt) || (Math.abs(c - cAnt) === 1 && f === fAnt);

                if (esAdyacente) {
                    bloqueado = true;
                    celdaSeleccionada.classList.remove('selected');
                    intercambiarPiezas(fAnt, cAnt, f, c);

                    // Esperamos a que termine el efecto visual del movimiento y evaluamos
                    setTimeout(() => {
                        if (!verificarYProcesarMatches()) {
                            // Si no hay Match 3, deshacemos el movimiento (movimiento inválido)
                            intercambiarPiezas(fAnt, cAnt, f, c);
                            bloqueado = false;
                        }
                    }, 250);
                    
                    celdaSeleccionada = null;
                } else {
                    celdaSeleccionada.classList.remove('selected');
                    celdaSeleccionada = celdaClick;
                    celdaClick.classList.add('selected');
                }
            }
        }

        function intercambiarPiezas(f1, c1, f2, c2) {
            let temp = matriz[f1][c1];
            matriz[f1][c1] = matriz[f2][c2];
            matriz[f2][c2] = temp;

            const celda1 = document.getElementById(`celda-${f1}-${c1}`);
            const celda2 = document.getElementById(`celda-${f2}-${c2}`);

            let imgTemp = celda1.innerHTML;
            celda1.innerHTML = celda2.innerHTML;
            celda2.innerHTML = imgTemp;
        }

        // Lógica algorítmica para encontrar combinaciones de 3 o más en línea
        function verificarYProcesarMatches() {
            let eliminar = Array(FILAS).fill(null).map(() => Array(COLUMNAS).fill(false));
            let encontrado = false;

            // Buscar en horizontal
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS - 2; c++) {
                    let id = matriz[f][c].id;
                    if (id !== null && matriz[f][c+1].id === id && matriz[f][c+2].id === id) {
                        eliminar[f][c] = eliminar[f][c+1] = eliminar[f][c+2] = true;
                        encontrado = true;
                    }
                }
            }

            // Buscar en vertical
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = 0; f < FILAS - 2; f++) {
                    let id = matriz[f][c].id;
                    if (id !== null && matriz[f+1][c].id === id && matriz[f+2][c].id === id) {
                        eliminar[f][c] = eliminar[f+1][c] = eliminar[f+2][c] = true;
                        encontrado = true;
                    }
                }
            }

            if (encontrado) {
                // Hacer desaparecer las celdas combinadas con animación
                for (let f = 0; f < FILAS; f++) {
                    for (let c = 0; c < COLUMNAS; c++) {
                        if (eliminar[f][c]) {
                            document.getElementById(`celda-${f}-${c}`).classList.add('match-exploding');
                            matriz[f][c] = { id: null }; // Borrado lógico
                            puntuacion += 10;
                        }
                    }
                }
                scoreVal.textContent = puntuacion;

                // Esperar a que se encojan las imágenes para reordenar la gravedad
                setTimeout(() => {
                    aplicarGravedad();
                }, 200);
            }

            return encontrado;
        }

        // Sistema de gravedad: caen las piezas superiores y se rellenan las de arriba
        function aplicarGravedad() {
            // Limpiar clases de animación previas
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    document.getElementById(`celda-${f}-${c}`).classList.remove('match-exploding');
                }
            }

            // Recorrer de abajo hacia arriba cada columna
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = FILAS - 1; f >= 0; f--) {
                    if (matriz[f][c].id === null) {
                        // Buscar una pieza viva más arriba
                        let fSuperior = f - 1;
                        while (fSuperior >= 0 && matriz[fSuperior][c].id === null) {
                            fSuperior--;
                        }

                        if (fSuperior >= 0) {
                            // Cae la pieza viva encontrada
                            matriz[f][c] = matriz[fSuperior][c];
                            matriz[fSuperior][c] = { id: null };
                        } else {
                            // Si no hay más piezas vivas arriba, se genera una gema nueva aleatoria
                            matriz[f][c] = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                        }
                    }
                }
            }

            // Redibujar el tablero completo ya actualizado por gravedad
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    const celda = document.getElementById(`celda-${f}-${c}`);
                    celda.innerHTML = `<img src="${matriz[f][c].url}" alt="${matriz[f][c].nombre}" class="w-full h-full object-contain pointer-events-none">`;
                }
            }

            // Comprobar si al caer nuevas piezas se genera un nuevo Match automático en cadena
            setTimeout(() => {
                if (verificarYProcesarMatches()) {
                    // Hay combos automáticos, sigue en bucle bloqueado
                } else {
                    bloqueado = false; // El tablero se detiene estable, devolvemos el control al jugador
                }
            }, 250);
        }

        crearTablero();
    </script>
</body>
</html>

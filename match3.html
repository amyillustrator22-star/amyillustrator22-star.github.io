<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Match 3 - Arcade Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #090d16;
        }
        .grid-cell img {
            transition: transform 0.25s ease-in-out, filter 0.2s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        .selected img {
            filter: drop-shadow(0 0 15px #33ff33) brightness(1.3);
            transform: scale(1.15);
        }
        .match-exploding img {
            transform: scale(0);
            opacity: 0;
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center min-h-screen font-mono p-4">

    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]">
            NEON MATCH 3
        </h1>
        <div class="mt-2 bg-slate-900/80 px-6 py-2 rounded-full border border-slate-800 backdrop-blur-sm shadow-md inline-block">
            <span class="text-gray-400 font-bold uppercase tracking-wider text-sm">Puntos:</span>
            <span id="score-val" class="text-cyan-400 font-black text-xl ml-2">0</span>
        </div>
    </div>

    <div id="tablero" class="grid grid-cols-6 gap-2 bg-slate-900/90 p-3 sm:p-4 rounded-[2rem] border-4 border-slate-800 shadow-[0_0_40px_rgba(0,0,0,0.7)] w-full max-w-[420px] aspect-square">
        </div>

    <script>
        const FILAS = 6;
        const COLUMNAS = 6;
        
        // Sprites actualizados en servidores seguros para evitar el bloqueo OpaqueResponseBlocking
        const PIEZAS = [
            { id: 0, nombre: 'estrella', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=80&h=80&q=80' },
            { id: 1, nombre: 'corazon', url: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=80&h=80&q=80' },
            { id: 2, nombre: 'esmeralda', url: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=80&h=80&q=80' },
            { id: 3, nombre: 'galaxia', url: 'https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&w=80&h=80&q=80' },
            { id: 4, nombre: 'fuego', url: 'https://images.unsplash.com/photo-1608889174637-3c44f6326f20?auto=format&fit=crop&w=80&h=80&q=80' },
            { id: 5, nombre: 'rayo', url: 'https://images.unsplash.com/photo-1618005198143-e5283b019a72?auto=format&fit=crop&w=80&h=80&q=80' }
        ];

        let matriz = [];
        let celdaSeleccionada = null;
        let puntuacion = 0;
        let bloqueado = false;

        const tablero = document.getElementById('tablero');
        const scoreVal = document.getElementById('score-val');

        function crearTablero() {
            tablero.innerHTML = '';
            matriz = [];

            for (let f = 0; f < FILAS; f++) {
                let filaMatriz = [];
                for (let c = 0; c < COLUMNAS; c++) {
                    let pieza;
                    do {
                        pieza = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                    } while (comprobarInicio(f, c, pieza, filaMatriz));

                    filaMatriz.push(pieza);

                    const celda = document.createElement('div');
                    celda.id = `celda-${f}-${c}`;
                    celda.dataset.fila = f;
                    celda.dataset.columna = c;
                    celda.className = "grid-cell flex items-center justify-center bg-slate-950/40 border border-slate-800/60 rounded-2xl p-1 cursor-pointer hover:bg-slate-800/30 transition-colors duration-150 aspect-square";
                    celda.innerHTML = `<img src="${pieza.url}" alt="${pieza.nombre}" class="w-full h-full object-contain pointer-events-none rounded-xl">`;
                    celda.addEventListener('click', manejarClic);

                    tablero.appendChild(celda);
                }
                matriz.push(filaMatriz);
            }
        }

        // CORRECCIÓN CRÍTICA: Añadida verificación segura de límites de la matriz
        function comprobarInicio(f, c, pieza, filaActual) {
            if (c >= 2 && filaActual[c-1] && filaActual[c-2] && filaActual[c-1].id === pieza.id && filaActual[c-2].id === pieza.id) return true;
            if (f >= 2 && matriz[f-1] && matriz[f-2] && matriz[f-1][c] && matriz[f-2][c] && matriz[f-1][c].id === pieza.id && matriz[f-2][c].id === pieza.id) return true;
            return false;
        }

        function manejarClic(e) {
            if (bloqueado) return;
            const celdaClick = e.currentTarget;
            const f = parseInt(celdaClick.dataset.fila);
            const c = parseInt(celdaClick.dataset.columna);

            if (!celdaSeleccionada) {
                celdaSeleccionada = celdaClick;
                celdaClick.classList.add('selected');
            } else {
                const fAnt = parseInt(celdaSeleccionada.dataset.fila);
                const cAnt = parseInt(celdaSeleccionada.dataset.columna);

                const esAdyacente = (Math.abs(f - fAnt) === 1 && c === cAnt) || (Math.abs(c - cAnt) === 1 && f === fAnt);

                if (esAdyacente) {
                    bloqueado = true;
                    celdaSeleccionada.classList.remove('selected');
                    intercambiarPiezas(fAnt, cAnt, f, c);

                    setTimeout(() => {
                        if (!verificarYProcesarMatches()) {
                            intercambiarPiezas(fAnt, cAnt, f, c);
                            bloqueado = false;
                        }
                    }, 250);
                    
                    celdaSeleccionada = null;
                } else {
                    celdaSeleccionada.classList.remove('selected');
                    celdaSeleccionada = celdaClick;
                    celdaClick.classList.add('selected');
                }
            }
        }

        function intercambiarPiezas(f1, c1, f2, c2) {
            let temp = matriz[f1][c1];
            matriz[f1][c1] = matriz[f2][c2];
            matriz[f2][c2] = temp;

            const celda1 = document.getElementById(`celda-${f1}-${c1}`);
            const celda2 = document.getElementById(`celda-${f2}-${c2}`);

            let imgTemp = celda1.innerHTML;
            celda1.innerHTML = celda2.innerHTML;
            celda2.innerHTML = imgTemp;
        }

        function verificarYProcesarMatches() {
            let eliminar = Array(FILAS).fill(null).map(() => Array(COLUMNAS).fill(false));
            let encontrado = false;

            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS - 2; c++) {
                    if (matriz[f][c] && matriz[f][c].id !== null && matriz[f][c+1] && matriz[f][c+2] && matriz[f][c+1].id === matriz[f][c].id && matriz[f][c+2].id === matriz[f][c].id) {
                        eliminar[f][c] = eliminar[f][c+1] = eliminar[f][c+2] = true;
                        encontrado = true;
                    }
                }
            }

            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = 0; f < FILAS - 2; f++) {
                    if (matriz[f][c] && matriz[f][c].id !== null && matriz[f+1][c] && matriz[f+2][c] && matriz[f+1][c].id === matriz[f][c].id && matriz[f+2][c].id === matriz[f][c].id) {
                        eliminar[f][c] = eliminar[f+1][c] = eliminar[f+2][c] = true;
                        encontrado = true;
                    }
                }
            }

            if (encontrado) {
                for (let f = 0; f < FILAS; f++) {
                    for (let c = 0; c < COLUMNAS; c++) {
                        if (eliminar[f][c]) {
                            document.getElementById(`celda-${f}-${c}`).classList.add('match-exploding');
                            matriz[f][c] = { id: null };
                            puntuacion += 10;
                        }
                    }
                }
                scoreVal.textContent = puntuacion;

                setTimeout(() => {
                    aplicarGravedad();
                }, 200);
            }

            return encontrado;
        }

        function aplicarGravedad() {
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    document.getElementById(`celda-${f}-${c}`).classList.remove('match-exploding');
                }
            }

            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = FILAS - 1; f >= 0; f--) {
                    if (matriz[f][c].id === null) {
                        let fSuperior = f - 1;
                        while (fSuperior >= 0 && matriz[fSuperior][c].id === null) {
                            fSuperior--;
                        }

                        if (fSuperior >= 0) {
                            matriz[f][c] = matriz[fSuperior][c];
                            matriz[fSuperior][c] = { id: null };
                        } else {
                            matriz[f][c] = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                        }
                    }
                }
            }

            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    const celda = document.getElementById(`celda-${f}-${c}`);
                    celda.innerHTML = `<img src="${matriz[f][c].url}" alt="${matriz[f][c].nombre}" class="w-full h-full object-contain pointer-events-none rounded-xl">`;
                }
            }

            setTimeout(() => {
                if (verificarYProcesarMatches()) {
                    // Combos en cadena
                } else {
                    bloqueado = false;
                }
            }, 250);
        }

        crearTablero();
    </script>
</body>
</html>

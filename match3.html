<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Match 3</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(10px, env(safe-area-inset-left));
            padding-right: max(10px, env(safe-area-inset-right));
            box-sizing: border-box;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        .title { font-size: 2.2rem; font-weight: bold; color: #f472b6; text-shadow: 0 0 15px #f472b6; margin-bottom: 5px; }
        .stats-container { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        .score-board { background: #1e293b; padding: 8px 25px; border-radius: 9999px; border: 1px solid #475569; font-size: 1.2rem; font-weight: bold; color: #22d3ee; }
        .level-board { background: #1e293b; padding: 8px 25px; border-radius: 9999px; border: 1px solid #475569; font-size: 1.2rem; font-weight: bold; color: #f472b6; }
        
        .btn-rendirse {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: 2px solid #f87171;
            padding: 8px 20px;
            border-radius: 9999px;
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            margin-bottom: 15px;
            user-select: none;
            touch-action: manipulation;
        }
        .btn-rendirse:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        .btn-rendirse:active { transform: scale(0.95); }

        canvas {
            background: #020617;
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
            cursor: pointer;
            
            /* 📱 AJUSTE EDGE-TO-EDGE PARA EVITAR CORTES EN POPUPS */
            width: 100% !important;
            max-width: 480px !important;
            height: auto !important;
            aspect-ratio: 1 / 1 !important;
            object-fit: contain;
            touch-action: none;
        }

        /* HONEYPOT VISUAL TRAMPA (No tocar) */
        .system-validate-field { position: absolute; left: -9999px; opacity: 0; }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
            padding: 0 4px;
            box-sizing: border-box;
        }
        .btn-volver {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            font-family: monospace;
            transition: all 0.2s;
        }
        .btn-volver:hover { background: rgba(239, 68, 68, 0.4); color: white; }
    </style>
</head>
<body>

    <div class="system-validate-field" aria-hidden="true">
        <input type="text" id="auth_token_verification" tabindex="-1" autocomplete="off">
    </div>

    <div class="top-bar">
        <a href="juegos.html" class="btn-volver">⬅ VOLVER AL MENÚ</a>
    </div>

    <div class="title">NEON MATCH 3</div>
    <div class="stats-container">
        <div class="score-board">PUNTOS: <span id="score-val">0</span></div>
        <div class="level-board">NIVEL: <span id="level-val">1</span></div>
    </div>

    <button id="btn-surrender" class="btn-rendirse">🏳️ RENDIDOR / FIN DE PARTIDA</button>

    <canvas id="canvas-match3" width="480" height="480"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById('canvas-match3');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const levelVal = document.getElementById('level-val');
        const btnSurrender = document.getElementById('btn-surrender');

        const FILAS = 8;
        const COLUMNAS = 8;
        const TAM_CASILLA = 60;

        const POOL_EMOJIS = ['💎', '❤️', '🔥', '⭐', '🔮', '🍀', '💀', '👽', '👻', '🤖'];
        
        let tablero = [];
        let score = 0;
        let nivel = 1;
        let totalEmojisDisponibles = 10; 
        let velocidadCaida = 110; 
        let casillaSeleccionada = null;
        let bloqueado = false;
        let gameOver = false;
        let efectosExplosion = [];
        let audioCtx = null;

        // --- SISTEMA DE SEGURIDAD INTEGRED ---
        let securityTriggered = false;
        window.match_points = 0; // Variable cebo global trampa

        function checkIntegrity() {
            const botInput = document.getElementById('auth_token_verification').value;
            if (botInput !== "" || window.match_points !== 0) securityTriggered = true;
        }

        function triggerTrap() {
            ctx.fillStyle = 'rgba(0,0,0,0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("S1ST3M4 L0CK", canvas.width/2, canvas.height/2 - 15);
            ctx.fillText("ANOMALY DETECTED", canvas.width/2, canvas.height/2 + 15);
        }
        // ------------------------------------

        function iniciarAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function sonarIntercambio() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
            osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.08); 
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function sonarMatchNormal() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.05); 
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function sonarGranExplosion() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function iniciarTablero() {
            let intentos = 0;
            do {
                tablero = [];
                for (let f = 0; f < FILAS; f++) {
                    tablero[f] = [];
                    for (let c = 0; c < COLUMNAS; c++) {
                        tablero[f][c] = {
                            id: Math.floor(Math.random() * totalEmojisDisponibles),
                            brillo: false
                        };
                    }
                }
                intentos++;
            } while ((evaluarMatchInmediato().length > 0 || !verificarMovimientosPosibles()) && intentos < 100);
            gameOver = false;
        }

        function evaluarMatchInmediato() {
            let eliminar = [];
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS - 2; c++) {
                    if (tablero[f]?.[c]?.id === tablero[f]?.[c+1]?.id && tablero[f]?.[c]?.id === tablero[f]?.[c+2]?.id) {
                        eliminar.push({f: f, c: c}, {f: f, c: c+1}, {f: f, c: c+2});
                    }
                }
            }
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = 0; f < FILAS - 2; f++) {
                    if (tablero[f]?.[c]?.id === tablero[f+1]?.[c]?.id && tablero[f]?.[c]?.id === tablero[f+2]?.[c]?.id) {
                        eliminar.push({f: f, c: c}, {f: f+1, c: c}, {f: f+2, c: c});
                    }
                }
            }
            return eliminar;
        }

        function verificarMovimientosPosibles() {
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    let direcciones = [{f:1, c:0}, {f:0, c:1}];
                    for (let d of direcciones) {
                        let nf = f + d.f;
                        let nc = c + d.c;
                        if (nf < FILAS && nc < COLUMNAS && tablero[f]?.[c] && tablero[nf]?.[nc]) {
                            let temp = tablero[f][c];
                            tablero[f][c] = tablero[nf][nc];
                            tablero[nf][nc] = temp;

                            let matches = evaluarMatchInmediato();

                            temp = tablero[f][c];
                            tablero[f][c] = tablero[nf][nc];
                            tablero[nf][nc] = temp;

                            if (matches.length > 0) return true;
                        }
                    }
                }
            }
            return false;
        }

        async function finalizarPartida(mensajeFinal = "¡SIN MOVIMIENTOS POSIBLES!") {
            checkIntegrity();
            if (gameOver || securityTriggered) return;
            gameOver = true;
            setTimeout(async () => {
                const nombre = prompt(`${mensajeFinal}\nPuntuación final: ${score} puntos.\n\nEscribe tu nombre para la Leaderboard global:`);
                if (nombre && nombre.trim() !== "") {
                    try {
                        await addDoc(collection(db, "scores_arcade"), {
                            game: "match3", 
                            player: nombre.trim().substring(0, 12),
                            score: parseInt(score),
                            country: "🇪🇸",
                            date: new Date().toISOString()
                        });
                        alert("¡Tu récord se ha subido a la Leaderboard global!");
                    } catch(e) { console.error(e); }
                }
            }, 300);
        }

        btnSurrender.addEventListener('click', () => {
            iniciarAudio();
            if(!gameOver) {
                finalizarPartida("🏳️ TE HAS RENDIDO VOLUNTARIAMENTE");
            }
        });

        function procesarMatches() {
            let matches = [];
            
            for (let f = 0; f < FILAS; f++) {
                let racha = 1;
                for (let c = 0; c < COLUMNAS; c++) {
                    if (c < COLUMNAS - 1 && tablero[f][c]?.id === tablero[f][c+1]?.id) {
                        racha++;
                    } else {
                        if (racha >= 3) {
                            let especial = racha >= 4;
                            for (let i = c - racha + 1; i <= c; i++) {
                                matches.push({f: f, c: i, esp: especial});
                            }
                        }
                        racha = 1;
                    }
                }
            }

            for (let c = 0; c < COLUMNAS; c++) {
                let racha = 1;
                for (let f = 0; f < FILAS; f++) {
                    if (f < FILAS - 1 && tablero[f][c]?.id === tablero[f+1][c]?.id) {
                        racha++;
                    } else {
                        if (racha >= 3) {
                            let especial = racha >= 4;
                            for (let i = f - racha + 1; i <= f; i++) {
                                matches.push({f: i, c: c, esp: especial});
                            }
                        }
                        racha = 1;
                    }
                }
            }

            if (matches.length === 0) {
                bloqueado = false;
                if (!verificarMovimientosPosibles()) {
                    finalizarPartida();
                }
                return;
            }

            bloqueado = true;
            let eliminarSet = new Set();
            let especialActivado = false;

            matches.forEach(m => {
                eliminarSet.add(`${m.f},${m.c}`);
                if (m.esp) {
                    especialActivado = true;
                    if(tablero[m.f]?.[m.c]) tablero[m.f][m.c].brillo = true;
                    efectosExplosion.push({x: m.c * TAM_CASILLA + 30, y: m.f * TAM_CASILLA + 30, r: 10, maxR: 120});
                    
                    for(let i=0; i<COLUMNAS; i++) eliminarSet.add(`${m.f},${i}`);
                    for(let i=0; i<FILAS; i++) eliminarSet.add(`${i},${m.c}`);
                }
            });

            if (especialActivado) {
                sonarGranExplosion();
            } else {
                sonarMatchNormal();
            }

            if (!securityTriggered) {
                let ptosPorCasilla = especialActivado ? 20 : 10;
                score += eliminarSet.size * ptosPorCasilla;
                scoreVal.textContent = score;
            }

            let nuevoNivel = Math.floor(score / 1000) + 1;
            if (nuevoNivel !== nivel) {
                nivel = nuevoNivel;
                levelVal.textContent = nivel;
                velocidadCaida = Math.max(50, 110 - (nivel * 10)); 
            }

            eliminarSet.forEach(key => {
                let [f, c] = key.split(',').map(Number);
                tablero[f][c] = null;
            });

            setTimeout(() => {
                caerJoyas();
                rellenarTablero();
                setTimeout(() => { procesarMatches(); }, velocidadCaida - 30);
            }, velocidadCaida);
        }

        function caerJoyas() {
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = FILAS - 1; f >= 0; f--) {
                    if (tablero[f][c] === null) {
                        for (let k = f - 1; k >= 0; k--) {
                            if (tablero[k][c] !== null) {
                                tablero[f][c] = tablero[k][c];
                                tablero[k][c] = null;
                                break;
                            }
                        }
                    }
                }
            }
        }

        function rellenarTablero() {
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    if (tablero[f][c] === null) {
                        tablero[f][c] = {
                            id: Math.floor(Math.random() * totalEmojisDisponibles),
                            brillo: false
                        };
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', e => {
            iniciarAudio();
            if (bloqueado || gameOver || securityTriggered) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Ajuste automático por escalado responsivo
            const c = Math.floor((x / canvas.clientWidth) * COLUMNAS);
            const f = Math.floor((y / canvas.clientHeight) * FILAS);

            if (!casillaSeleccionada) {
                casillaSeleccionada = {f: f, c: c};
            } else {
                let adyacente = (Math.abs(casillaSeleccionada.f - f) === 1 && casillaSeleccionada.c === c) ||
                                (Math.abs(casillaSeleccionada.c - c) === 1 && casillaSeleccionada.f === f);

                if (adyacente) {
                    bloqueado = true;
                    sonarIntercambio();
                    let temp = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                    tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                    tablero[f][c] = temp;

                    let matches = evaluarMatchInmediato();
                    if (matches.length > 0) {
                        casillaSeleccionada = null;
                        procesarMatches();
                    } else {
                        setTimeout(() => {
                            let rev = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                            tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                            tablero[f][c] = rev;
                            casillaSeleccionada = null;
                            bloqueado = false;
                        }, 180);
                    }
                } else {
                    casillaSeleccionada = {f: f, c: c};
                }
            }
        });

        // 📱 CONTROLES DE TOQUE TÁCTIL MÓVIL DIRECTO (Alternativa limpia a clics)
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            iniciarAudio();
            if (bloqueado || gameOver || securityTriggered) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            const c = Math.floor((x / canvas.clientWidth) * COLUMNAS);
            const f = Math.floor((y / canvas.clientHeight) * FILAS);

            if (!casillaSeleccionada) {
                casillaSeleccionada = {f: f, c: c};
            } else {
                let adyacente = (Math.abs(casillaSeleccionada.f - f) === 1 && casillaSeleccionada.c === c) ||
                                (Math.abs(casillaSeleccionada.c - c) === 1 && casillaSeleccionada.f === f);

                if (adyacente) {
                    bloqueado = true;
                    sonarIntercambio();
                    let temp = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                    tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                    tablero[f][c] = temp;

                    let matches = evaluarMatchInmediato();
                    if (matches.length > 0) {
                        casillaSeleccionada = null;
                        procesarMatches();
                    } else {
                        setTimeout(() => {
                            let rev = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                            tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                            tablero[f][c] = rev;
                            casillaSeleccionada = null;
                            bloqueado = false;
                        }, 180);
                    }
                } else {
                    casillaSeleccionada = {f: f, c: c};
                }
            }
        }, {passive: false});

        // textBaseline "middle" assumes every glyph shares the same ascent/descent.
        // The ❤️ emoji needs a variation selector to render in color, so its actual
        // ink box differs from the other pool emojis on iOS Safari and Firefox,
        // making it appear off-center. Measuring each glyph's real bounding box
        // once and offsetting by it centers every emoji precisely, on any screen size.
        function calcularOffsetsEmojis(ctx) {
            ctx.font = "36px Arial";
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            return POOL_EMOJIS.map(emoji => {
                const m = ctx.measureText(emoji);
                const left = m.actualBoundingBoxLeft || 0;
                const right = m.actualBoundingBoxRight || 0;
                const asc = m.actualBoundingBoxAscent || 18;
                const desc = m.actualBoundingBoxDescent || 18;
                return { x: (right - left) / 2, y: (asc - desc) / 2 };
            });
        }
        const emojiOffsets = calcularOffsetsEmojis(ctx);

        function dibujarJoyaEmoji(ctx, cx, cy, id, brillo) {
            ctx.save();
            let emoji = POOL_EMOJIS[id];
            let off = emojiOffsets[id];
            ctx.shadowBlur = brillo ? 30 : 8;
            ctx.shadowColor = brillo ? '#ffffff' : 'rgba(168, 85, 247, 0.3)';
            ctx.font = "36px Arial";
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            ctx.fillText(emoji, cx - off.x, cy + off.y);
            ctx.restore();
        }

        function dibujar() {
            checkIntegrity();
            if (securityTriggered) { triggerTrap(); return; }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for(let i=0; i<=FILAS; i++) {
                ctx.beginPath(); ctx.moveTo(0, i*TAM_CASILLA); ctx.lineTo(canvas.width, i*TAM_CASILLA); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(i*TAM_CASILLA, 0); ctx.lineTo(i*TAM_CASILLA, canvas.height); ctx.stroke();
            }

            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    if (tablero[f]?.[c]) {
                        let cx = c * TAM_CASILLA + TAM_CASILLA/2;
                        let cy = f * TAM_CASILLA + TAM_CASILLA/2;
                        dibujarJoyaEmoji(ctx, cx, cy, tablero[f][c].id, tablero[f][c].brillo);
                    }
                }
            }

            if (casillaSeleccionada) {
                ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3;
                ctx.strokeRect(casillaSeleccionada.c * TAM_CASILLA + 4, casillaSeleccionada.f * TAM_CASILLA + 4, TAM_CASILLA - 8, TAM_CASILLA - 8);
            }

            efectosExplosion.forEach((e, i) => {
                ctx.save();
                ctx.strokeStyle = 'rgba(34, 211, 238, '+ (1 - e.r/e.maxR) +')';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15; ctx.shadowColor = '#22d3ee';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
                e.r += 6;
                if(e.r >= e.maxR) efectosExplosion.splice(i, 1);
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f472b6'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
                ctx.fillText("PARTIDA CONCLUIDA", canvas.width/2, canvas.height/2);
            }

            requestAnimationFrame(dibujar);
        }

        iniciarTablero();
        dibujar();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Match 3</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
        }
        .title { font-size: 2.2rem; font-weight: bold; color: #a855f7; text-shadow: 0 0 15px #a855f7; margin-bottom: 5px; }
        .score-board { background: #1e293b; padding: 8px 25px; border-radius: 9999px; border: 1px solid #475569; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #f472b6; }
        canvas {
            background: #020617;
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="title">NEON MATCH 3</div>
    <div class="score-board">PUNTOS: <span id="score-val">0</span></div>

    <canvas id="canvas-match3" width="480" height="480"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById('canvas-match3');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');

        const FILAS = 8;
        const COLUMNAS = 8;
        const TAM_CASILLA = 60;

        const COLORES_JOYAS = ['#ef4444', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7700'];
        let tablero = [];
        let score = 0;
        let casillaSeleccionada = null;
        let bloqueado = false;
        let gameOver = false;
        let efectosExplosion = [];

        function iniciarTablero() {
            do {
                tablero = [];
                for (let f = 0; f < FILAS; f++) {
                    tablero[f] = [];
                    for (let c = 0; c < COLUMNAS; c++) {
                        tablero[f][c] = {
                            id: Math.floor(Math.random() * COLORES_JOYAS.length),
                            brillo: false
                        };
                    }
                }
            } while (evaluarMatchInmediato().length > 0 || !verificarMovimientosPosibles());
        }

        function evaluarMatchInmediato() {
            let eliminar = [];
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS - 2; c++) {
                    if (tablero[f][c].id === tablero[f][c+1].id && tablero[f][c].id === tablero[f][c+2].id) {
                        eliminar.push({f: f, c: c}, {f: f, c: c+1}, {f: f, c: c+2});
                    }
                }
            }
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = 0; f < FILAS - 2; f++) {
                    if (tablero[f][c].id === tablero[f+1][c].id && tablero[f][c].id === tablero[f+2][c].id) {
                        eliminar.push({f: f, c: c}, {f: f+1, c: c}, {f: f+2, c: c});
                    }
                }
            }
            return eliminar;
        }

        // 🛠️ LOGiCA NUEVA: Verifica si quedan movimientos válidos en el tablero
        function verificarMovimientosPosibles() {
            const direcciones = [{f:1, c:0}, {f:0, c:1}];
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    for (let d of direcciones) {
                        let nf = f + d.f;
                        let nc = c + d.c;
                        if (nf < FILAS && nc < COLUMNAS) {
                            // Intercambio simulado
                            let temp = tablero[f][c];
                            tablero[f][c] = tablero[nf][nc];
                            tablero[nf][nc] = temp;

                            let matches = evaluarMatchInmediato();

                            // Revertir simulación
                            temp = tablero[f][c];
                            tablero[f][c] = tablero[nf][nc];
                            tablero[nf][nc] = temp;

                            if (matches.length > 0) return true; // Hay al menos una combinación posible
                        }
                    }
                }
            }
            return false;
        }

        async function finalizarPartida() {
            gameOver = true;
            const nombre = prompt(`¡SE ACABARON LOS MOVIMIENTOS!\nPuntuación total: ${score} puntos.\n\nGuarda tu récord para la Leaderboard:`);
            if (nombre && nombre.trim() !== "") {
                try {
                    await addDoc(collection(db, "scores_arcade"), {
                        game: "match3",
                        player: nombre.trim().substring(0, 12),
                        score: parseInt(score),
                        country: "🇪🇸",
                        date: new Date().toISOString()
                    });
                    alert("¡Récord guardado con éxito!");
                } catch(e) {}
            }
        }

        // 🛠️ LOGICA NUEVA: Procesa combinaciones, dobles puntos y explosiones en cruz de neón
        function procesarMatches() {
            let matches = [];
            
            // Buscar horizontales detectando tamaños
            for (let f = 0; f < FILAS; f++) {
                let racha = 1;
                for (let c = 0; c < COLUMNAS; c++) {
                    if (c < COLUMNAS - 1 && tablero[f][c].id === tablero[f][c+1].id) {
                        racha++;
                    } else {
                        if (racha >= 3) {
                            let esEspecial = racha >= 4;
                            for (let i = c - racha + 1; i <= c; i++) {
                                matches.push({f: f, c: i, especial: esEspecial});
                            }
                        }
                        racha = 1;
                    }
                }
            }

            // Buscar verticales detectando tamaños
            for (let c = 0; c < COLUMNAS; c++) {
                let racha = 1;
                for (let f = 0; f < FILAS; f++) {
                    if (f < FILAS - 1 && tablero[f][c].id === tablero[f+1][c].id) {
                        racha++;
                    } else {
                        if (racha >= 3) {
                            let esEspecial = racha >= 4;
                            for (let i = f - racha + 1; i <= f; i++) {
                                matches.push({f: i, c: c, especial: esEspecial});
                            }
                        }
                        racha = 1;
                    }
                }
            }

            if (matches.length === 0) {
                bloqueado = false;
                // Si ya no se está procesando nada, comprobar si es el fin definitivo de la partida
                if (!verificarMovimientosPosibles() && !gameOver) {
                    finalizarPartida();
                }
                return;
            }

            bloqueado = true;
            let casillasAEliminar = new Set();
            let filasAExplotar = new Set();
            let colAExplotar = new Set();

            matches.forEach(m => {
                let key = `${m.f},${m.c}`;
                casillasAEliminar.add(key);
                if (m.especial) {
                    filasAExplotar.add(m.f);
                    colAExplotar.add(m.c);
                    tablero[m.f][m.c].brillo = true; // Activa el efecto visual destellante
                    efectosExplosion.push({x: m.c * TAM_CASILLA + 30, y: m.f * TAM_CASILLA + 30, r: 10, maxR: 90});
                }
            });

            // Aplicar las explosiones en Cruz por combinaciones de 4+
            filasAExplotar.forEach(f => {
                for(let c=0; c<COLUMNAS; c++) casillasAEliminar.add(`${f},${c}`);
            });
            colAExplotar.forEach(c => {
                for(let f=0; f<FILAS; f++) casillasAEliminar.add(`${f},${c}`);
            });

            // Calcular puntos (Doble punto si hubo explosiones especiales activadas)
            let multiplicador = (filasAExplotar.size > 0 || colAExplotar.size > 0) ? 20 : 10;
            score += casillasAEliminar.size * multiplicador;
            scoreVal.textContent = score;

            // Eliminar y vaciar casillas
            casillasAEliminar.forEach(key => {
                let [f, c] = key.split(',').map(Number);
                tablero[f][c] = null;
            });

            setTimeout(() => {
                caerJoyas();
                rellenarTablero();
                setTimeout(() => { procesarMatches(); }, 250);
            }, 300);
        }

        function caerJoyas() {
            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = FILAS - 1; f >= 0; f--) {
                    if (tablero[f][c] === null) {
                        for (let k = f - 1; k >= 0; k--) {
                            if (tablero[k][c] !== null) {
                                tablero[f][c] = tablero[k][c];
                                tablero[k][c] = null;
                                break;
                            }
                        }
                    }
                }
            }
        }

        function rellenarTablero() {
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    if (tablero[f][c] === null) {
                        tablero[f][c] = {
                            id: Math.floor(Math.random() * COLORES_JOYAS.length),
                            brillo: false
                        };
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', e => {
            if (bloqueado || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.floor(x / TAM_CASILLA);
            const f = Math.floor(y / TAM_CASILLA);

            if (!casillaSeleccionada) {
                casillaSeleccionada = {f: f, c: c};
            } else {
                let adyacente = (Math.abs(casillaSeleccionada.f - f) === 1 && casillaSeleccionada.c === c) ||
                                (Math.abs(casillaSeleccionada.c - c) === 1 && casillaSeleccionada.f === f);

                if (adyacente) {
                    bloqueado = true;
                    let temp = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                    tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                    tablero[f][c] = temp;

                    let matches = evaluarMatchInmediato();
                    if (matches.length > 0) {
                        casillaSeleccionada = null;
                        procesarMatches();
                    } else {
                        // Deshacer si no hace match de 3
                        setTimeout(() => {
                            let revertir = tablero[casillaSeleccionada.f][casillaSeleccionada.c];
                            tablero[casillaSeleccionada.f][casillaSeleccionada.c] = tablero[f][c];
                            tablero[f][c] = revertir;
                            casillaSeleccionada = null;
                            bloqueado = false;
                        }, 200);
                    }
                } else {
                    casillaSeleccionada = {f: f, c: c};
                }
            }
        });

        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cuadrícula de fondo
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for(let i=0; i<=FILAS; i++) {
                ctx.beginPath(); ctx.moveTo(0, i*TAM_CASILLA); ctx.lineTo(canvas.width, i*TAM_CASILLA); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(i*TAM_CASILLA, 0); ctx.lineTo(i*TAM_CASILLA, canvas.height); ctx.stroke();
            }

            // Dibujar joyas
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    if (tablero[f][c]) {
                        let color = COLORES_JOYAS[tablero[f][c].id];
                        let cx = c * TAM_CASILLA + TAM_CASILLA/2;
                        let cy = f * TAM_CASILLA + TAM_CASILLA/2;

                        ctx.save();
                        if (tablero[f][c].brillo) {
                            ctx.shadowBlur = 25; ctx.shadowColor = '#ffffff';
                            ctx.fillStyle = '#ffffff';
                        } else {
                            ctx.shadowBlur = 10; ctx.shadowColor = color;
                            ctx.fillStyle = color;
                        }

                        ctx.beginPath();
                        ctx.arc(cx, cy, 18, 0, Math.PI*2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }

            // Marcar joya seleccionada
            if (casillaSeleccionada) {
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
                ctx.strokeRect(casillaSeleccionada.c * TAM_CASILLA + 2, casillaSeleccionada.f * TAM_CASILLA + 2, TAM_CASILLA - 4, TAM_CASILLA - 4);
            }

            // Dibujar ondas de choques de neón (explosiones)
            efectosExplosion.forEach((e, index) => {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, '+ (1 - e.r/e.maxR) +')';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
                e.r += 4;
                if(e.r >= e.maxR) efectosExplosion.splice(index, 1);
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f472b6'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
                ctx.fillText("SIN MOVIMIENTOS POSIBLES", canvas.width/2, canvas.height/2);
            }

            requestAnimationFrame(dibujar);
        }

        iniciarTablero();
        dibujar();
    </script>
</body>
</html>

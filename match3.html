<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Match 3</title>
    <style>
        body {
            background: #090d16;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .title { font-size: 2rem; font-weight: bold; letter-spacing: 2px; color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        .score-box { background: #1e293b; padding: 8px 20px; rounded-radius: 20px; border: 1px solid #334155; margin-top: 10px; display: inline-block; border-radius: 9999px; }
        .score-val { color: #06b6d4; font-weight: bold; }
        
        .tablero {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 16px;
            border-radius: 24px;
            border: 4px solid #1e293b;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            width: 90vw;
            max-width: 360px;
            aspect-ratio: 1/1;
            box-sizing: border-box;
        }
        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.8rem;
            user-select: none;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            background: rgba(30, 41, 59, 0.5);
        }
        .cell-0 { border: 2px solid #eab308; box-shadow: inset 0 0 8px rgba(234,179,8,0.3); }
        .cell-1 { border: 2px solid #ef4444; box-shadow: inset 0 0 8px rgba(239,68,68,0.3); }
        .cell-2 { border: 2px solid #06b6d4; box-shadow: inset 0 0 8px rgba(6,182,212,0.3); }
        .cell-3 { border: 2px solid #a855f7; box-shadow: inset 0 0 8px rgba(168,85,247,0.3); }
        .cell-4 { border: 2px solid #f97316; box-shadow: inset 0 0 8px rgba(249,115,22,0.3); }
        .cell-5 { border: 2px solid #10b981; box-shadow: inset 0 0 8px rgba(16,185,129,0.3); }

        .selected {
            filter: brightness(1.4);
            transform: scale(1.08);
            background: rgba(51, 255, 51, 0.2) !important;
            border-color: #33ff33 !important;
        }
        .match-exploding { transform: scale(0); opacity: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">NEON MATCH 3</div>
        <div class="score-box">PUNTOS: <span id="score-val" class="score-val">0</span></div>
    </div>

    <div id="tablero" class="tablero"></div>

    <script>
        const FILAS = 6;
        const COLUMNAS = 6;
        
        const PIEZAS = [
            { id: 0, simbolo: '⭐', clase: 'cell-0' },
            { id: 1, simbolo: '❤️', clase: 'cell-1' },
            { id: 2, simbolo: '💎', clase: 'cell-2' },
            { id: 3, simbolo: '🔮', clase: 'cell-3' },
            { id: 4, simbolo: '🔥', clase: 'cell-4' },
            { id: 5, simbolo: '🍀', clase: 'cell-5' }
        ];

        let matriz = [];
        let celdaSeleccionada = null;
        let puntuacion = 0;
        let bloqueado = false;

        const tablero = document.getElementById('tablero');
        const scoreVal = document.getElementById('score-val');

        function crearTablero() {
            tablero.innerHTML = '';
            matriz = [];

            for (let f = 0; f < FILAS; f++) {
                let filaMatriz = [];
                for (let c = 0; c < COLUMNAS; c++) {
                    let pieza;
                    do {
                        pieza = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                    } while (comprobarInicio(f, c, pieza, filaMatriz));

                    filaMatriz.push(pieza);

                    const celda = document.createElement('div');
                    celda.id = `celda-${f}-${c}`;
                    celda.dataset.fila = f;
                    celda.dataset.columna = c;
                    celda.className = `grid-cell ${pieza.clase}`;
                    celda.textContent = pieza.simbolo;
                    celda.addEventListener('click', manejarClic);

                    tablero.appendChild(celda);
                }
                matriz.push(filaMatriz);
            }
        }

        function comprobarInicio(f, c, pieza, filaActual) {
            if (c >= 2 && filaActual[c-1] && filaActual[c-2] && filaActual[c-1].id === pieza.id && filaActual[c-2].id === pieza.id) return true;
            if (f >= 2 && matriz[f-1] && matriz[f-2] && matriz[f-1][c] && matriz[f-2][c] && matriz[f-1][c].id === pieza.id && matriz[f-2][c].id === pieza.id) return true;
            return false;
        }

        function manejarClic(e) {
            if (bloqueado) return;
            const celdaClick = e.currentTarget;
            const f = parseInt(celdaClick.dataset.fila);
            const c = parseInt(celdaClick.dataset.columna);

            if (!celdaSeleccionada) {
                celdaSeleccionada = celdaClick;
                celdaClick.classList.add('selected');
            } else {
                const fAnt = parseInt(celdaSeleccionada.dataset.fila);
                const cAnt = parseInt(celdaSeleccionada.dataset.columna);

                const esAdyacente = (Math.abs(f - fAnt) === 1 && c === cAnt) || (Math.abs(c - cAnt) === 1 && f === fAnt);

                if (esAdyacente) {
                    bloqueado = true;
                    celdaSeleccionada.classList.remove('selected');
                    intercambiarPiezas(fAnt, cAnt, f, c);

                    setTimeout(() => {
                        if (!verificarYProcesarMatches()) {
                            intercambiarPiezas(fAnt, cAnt, f, c);
                            bloqueado = false;
                        }
                    }, 250);
                    
                    celdaSeleccionada = null;
                } else {
                    celdaSeleccionada.classList.remove('selected');
                    celdaSeleccionada = celdaClick;
                    celdaClick.classList.add('selected');
                }
            }
        }

        function intercambiarPiezas(f1, c1, f2, c2) {
            let temp = matriz[f1][c1];
            matriz[f1][c1] = matriz[f2][c2];
            matriz[f2][c2] = temp;

            const celda1 = document.getElementById(`celda-${f1}-${c1}`);
            const celda2 = document.getElementById(`celda-${f2}-${c2}`);

            let textoTemp = celda1.textContent;
            let claseTemp = celda1.className;

            celda1.textContent = celda2.textContent;
            celda1.className = celda2.className;

            celda2.textContent = textoTemp;
            celda2.className = claseTemp;
        }

        function verificarYProcesarMatches() {
            let eliminar = Array(FILAS).fill(null).map(() => Array(COLUMNAS).fill(false));
            let encontrado = false;

            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS - 2; c++) {
                    if (matriz[f][c] && matriz[f][c].id !== null && matriz[f][c+1] && matriz[f][c+2] && matriz[f][c+1].id === matriz[f][c].id && matriz[f][c+2].id === matriz[f][c].id) {
                        eliminar[f][c] = eliminar[f][c+1] = eliminar[f][c+2] = true;
                        encontrado = true;
                    }
                }
            }

            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = 0; f < FILAS - 2; f++) {
                    if (matriz[f][c] && matriz[f][c].id !== null && matriz[f+1][c] && matriz[f+2][c] && matriz[f+1][c].id === matriz[f][c].id && matriz[f+2][c].id === matriz[f][c].id) {
                        eliminar[f][c] = eliminar[f+1][c] = eliminar[f+2][c] = true;
                        encontrado = true;
                    }
                }
            }

            if (encontrado) {
                for (let f = 0; f < FILAS; f++) {
                    for (let c = 0; c < COLUMNAS; c++) {
                        if (eliminar[f][c]) {
                            document.getElementById(`celda-${f}-${c}`).classList.add('match-exploding');
                            matriz[f][c] = { id: null };
                            puntuacion += 10;
                        }
                    }
                }
                scoreVal.textContent = puntuacion;

                setTimeout(() => {
                    aplicarGravedad();
                }, 250);
            }

            return encontrado;
        }

        function aplicarGravedad() {
            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    document.getElementById(`celda-${f}-${c}`).classList.remove('match-exploding');
                }
            }

            for (let c = 0; c < COLUMNAS; c++) {
                for (let f = FILAS - 1; f >= 0; f--) {
                    if (matriz[f][c].id === null) {
                        let fSuperior = f - 1;
                        while (fSuperior >= 0 && matriz[fSuperior][c].id === null) {
                            fSuperior--;
                        }

                        if (fSuperior >= 0) {
                            matriz[f][c] = matriz[fSuperior][c];
                            matriz[fSuperior][c] = { id: null };
                        } else {
                            matriz[f][c] = PIEZAS[Math.floor(Math.random() * PIEZAS.length)];
                        }
                    }
                }
            }

            for (let f = 0; f < FILAS; f++) {
                for (let c = 0; c < COLUMNAS; c++) {
                    const celda = document.getElementById(`celda-${f}-${c}`);
                    celda.textContent = matriz[f][c].simbolo;
                    celda.className = `grid-cell ${matriz[f][c].clase}`;
                }
            }

            setTimeout(() => {
                if (verificarYProcesarMatches()) {
                    // combos
                } else {
                    bloqueado = false;
                }
            }, 250);
        }

        crearTablero();
    </script>
</body>
</html>

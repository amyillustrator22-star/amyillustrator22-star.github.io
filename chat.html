<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibezMatch - Chat Social</title>
    
    <!-- Script de verificación de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608"
     crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 10px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif;
        }
        #login-screen {
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.3); width: 90%; max-width: 400px;
        }
        #login-screen h3 { font-family: 'Righteous', cursive; color: #764ba2; margin-bottom: 20px;}
        .auth-input { 
            padding: 12px; border: 2px solid #ddd; border-radius: 25px; outline: none; 
            margin-bottom: 10px; width: 85%; box-sizing: border-box;
        }
        
        .chat-container {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            width: 100%; max-width: 600px; height: 75vh; display: none; 
            flex-direction: column; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .chat-header {
            background: #2ecc71; color: white; padding: 15px; text-align: center;
            font-family: 'Righteous', cursive; font-size: 1.5rem; display: flex; justify-content: space-between; align-items: center;
        }
        #logout-btn { font-size: 0.8rem; padding: 5px 10px; background: #e74c3c; }
        
        #messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { background: #e1f5fe; color: #2c3e50; padding: 10px 15px; border-radius: 15px; align-self: flex-start; max-width: 80%; word-wrap: break-word;}
        .message-bubble.me { background: #2ecc71; color: white; align-self: flex-end; }
        .msg-uid { font-size: 0.6rem; color: #888; display: block; margin-top: 4px; }
        
        .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; gap: 10px; }
        #messageInput { flex-grow: 1; padding: 12px; border: 2px solid #ddd; border-radius: 25px; outline: none; }
        button { background: #2ecc71; color: white; border: none; border-radius: 25px; padding: 10px 20px; font-family: 'Righteous', cursive; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
        .btn-secondary { background: #3498db; margin-top: 10px; }

        #ad-container-web {
            width: 100%; max-width: 600px; text-align: center;
            background: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 5px; display: none; 
        }

        /* PANEL DE ADMINISTRADORA (Oculto por defecto) */
        #admin-panel {
            background: #e74c3c; color: white; padding: 10px; text-align: center; display: none;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        #admin-panel input { padding: 5px; border-radius: 10px; border: none; outline: none; margin-right: 5px; }
        #admin-panel button { background: #c0392b; padding: 5px 10px; font-size: 0.9rem;}
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN / REGISTRO -->
    <div id="login-screen">
        <h3>ACCESO AL CHAT</h3>
        <input type="text" id="regNameInput" class="auth-input" placeholder="Tu Nickname (Solo para registro)" autocomplete="off">
        <input type="email" id="emailInput" class="auth-input" placeholder="Correo electrónico" autocomplete="off">
        <input type="password" id="passwordInput" class="auth-input" placeholder="Contraseña" autocomplete="off">
        <br>
        <button onclick="login()">ENTRAR</button>
        <button class="btn-secondary" onclick="register()">CREAR CUENTA</button>
        <p id="auth-error" style="color: #e74c3c; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>

    <!-- PANTALLA DEL CHAT -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            VIBEZMATCH CHAT
            <button id="logout-btn" onclick="logout()">Salir</button>
        </div>
        <div id="messages-area">
            <div class="message-bubble" id="welcome-msg" style="background:#d4edda;">Conectando de forma segura...</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
            <button onclick="sendMessage()">ENVIAR</button>
        </div>
        
        <!-- PANEL SECRETO PARA BANEAR (Aparece si eres administradora) -->
        <div id="admin-panel">
            <strong>ADMINISTRADORA:</strong>
            <input type="text" id="banUidInput" placeholder="Pega el UID a banear">
            <button onclick="banUser()">Bloquear Usuario</button>
        </div>
    </div>

    <div id="ad-container-web">
        <p style="font-size: 10px; color: #666; margin: 2px;">Publicidad</p>
        <div style="width: 100%; height: 90px; background: #eee; border: 1px dashed #ccc; line-height: 90px; color: #999;">
            Bloque de Anuncio (AdSense)
        </div>
    </div>

    <a href="admin_console_debug.html" style="display:none;" id="honeypot-link-chat" aria-hidden="true">Debug Console</a>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-check-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.firebasestorage.app",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a",
            measurementId: "G-JKN6EBRHWZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ⚠️ CAMBIA ESTO POR TU CORREO REAL DE ADMINISTRADORA
        const CORREO_ADMIN = "amyillustrator22@gmail.com"; 
        
        let unsubscribeChat = null;

        // --- SISTEMA DE CENSURA ---
        function censurarMensaje(texto) {
            // Añade aquí las palabras que quieres censurar separadas por comas
            const palabrasProhibidas = ["insulto1", "insulto2", "spam", "odio"]; 
            let filtrado = texto;
            palabrasProhibidas.forEach(palabra => {
                const regex = new RegExp(palabra, "gi"); // 'gi' hace que no importe si hay mayúsculas
                filtrado = filtrado.replace(regex, "****");
            });
            return filtrado;
        }

        // --- AUTENTICACIÓN ---
        function register() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const nick = document.getElementById('regNameInput').value.trim();
            const errorLabel = document.getElementById('auth-error');

            if(!nick) { errorLabel.innerText = "Necesitas un Nickname para registrarte."; return; }

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Guardamos el nick en su perfil
                    return userCredential.user.updateProfile({ displayName: nick });
                })
                .catch((error) => { errorLabel.innerText = "Error: " + error.message; });
        }

        function login() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const errorLabel = document.getElementById('auth-error');

            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => { errorLabel.innerText = "Error: Correo o contraseña incorrectos."; });
        }

        function logout() {
            auth.signOut();
        }

        // Detectar si el usuario inicia o cierra sesión
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none'; 
                document.getElementById('chatContainer').style.display = 'flex'; 
                document.getElementById('ad-container-web').style.display = 'block'; 
                document.getElementById('welcome-msg').innerText = "¡Bienvenid@ " + (user.displayName || "Usuario") + "!";
                
                // Activar panel de administradora si es tu correo
                if(user.email === CORREO_ADMIN) {
                    document.getElementById('admin-panel').style.display = 'block';
                } else {
                    document.getElementById('admin-panel').style.display = 'none';
                }

                escucharMensajes();
            } else {
                // Si cierra sesión, volvemos a la pantalla principal
                if(unsubscribeChat) unsubscribeChat(); // Detiene la lectura del chat
                document.getElementById('login-screen').style.display = 'block'; 
                document.getElementById('chatContainer').style.display = 'none'; 
                document.getElementById('ad-container-web').style.display = 'none';
                document.getElementById('emailInput').value = '';
                document.getElementById('passwordInput').value = '';
                document.getElementById('messages-area').innerHTML = '<div class="message-bubble" id="welcome-msg" style="background:#d4edda;">Conectando de forma segura...</div>';
            }
        });

        // --- SISTEMA DE CHAT ---
        function sendMessage() {
            const inputField = document.getElementById('messageInput');
            const rawText = inputField.value.trim();
            const user = auth.currentUser;
            
            if (rawText !== '' && user) {
                // Pasamos el texto por el filtro de censura antes de enviarlo
                const textoLimpio = censurarMensaje(rawText);

                db.collection("chat_global").add({
                    texto: textoLimpio,
                    usuario: user.displayName || "Anónimo",
                    uid: user.uid, // Guardamos el UID para que puedas banearlo si es necesario
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    inputField.value = '';
                }).catch((error) => {
                    alert("No se pudo enviar el mensaje. Es posible que hayas sido bloqueado.");
                });
            }
        }

        function escucharMensajes() {
            const limite = new Date();
            limite.setDate(limite.getDate() - 1);

            unsubscribeChat = db.collection("chat_global")
              .where("timestamp", ">=", limite)
              .orderBy("timestamp", "asc")
              .onSnapshot((snapshot) => {
                  snapshot.docChanges().forEach((change) => {
                      if (change.type === "added") {
                          const msgData = change.doc.data();
                          if (msgData.usuario && msgData.texto) {
                              const msgDiv = document.createElement('div');
                              msgDiv.classList.add('message-bubble');
                              // Si el mensaje es tuyo, le pone otro color
                              if(msgData.uid === auth.currentUser.uid) {
                                  msgDiv.classList.add('me');
                              }
                              
                              // Solo si eres admin, verás el UID de la persona debajo de su mensaje
                              let uidHTML = "";
                              if(auth.currentUser.email === CORREO_ADMIN) {
                                  uidHTML = `<span class="msg-uid">UID: ${msgData.uid}</span>`;
                              }

                              msgDiv.innerHTML = `<strong>${msgData.usuario}:</strong> ${msgData.texto} ${uidHTML}`;
                              const area = document.getElementById('messages-area');
                              area.appendChild(msgDiv);
                              area.scrollTop = area.scrollHeight;
                          }
                      }
                  });
              });
        }

        // --- SISTEMA DE BANEO (Solo para administradora) ---
        function banUser() {
            const uidABanear = document.getElementById('banUidInput').value.trim();
            if(uidABanear && auth.currentUser.email === CORREO_ADMIN) {
                // Guardamos el UID en la colección de baneados
                db.collection("usuarios_baneados").doc(uidABanear).set({
                    fecha_baneo: firebase.firestore.FieldValue.serverTimestamp(),
                    baneado_por: auth.currentUser.email
                }).then(() => {
                    alert("Usuario baneado correctamente de la plataforma.");
                    document.getElementById('banUidInput').value = '';
                }).catch(error => {
                    alert("Error al banear: " + error.message);
                });
            }
        }

        // --- CAPAS DE SEGURIDAD AMY SOFTWARE ---
        (function() {
            setInterval(function() {
                const startTime = performance.now();
                debugger; 
                if (performance.now() - startTime > 100) {
                    db.collection('security_alerts').add({
                        event_type: "chat_debug_attempt",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            }, 1000);
        })();

        document.getElementById("messageInput").addEventListener("keyup", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>

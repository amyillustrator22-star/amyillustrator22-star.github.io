<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibezMatch - Chat Social</title>
    
    <!-- Script de verificación de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608"
     crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 10px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif;
        }
        #login-screen {
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        #login-screen h3 { font-family: 'Righteous', cursive; color: #764ba2; }
        #userNameInput { padding: 12px; border: 2px solid #ddd; border-radius: 25px; outline: none; margin-bottom: 10px; width: 80%; }

        .chat-container {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            width: 100%; max-width: 600px; height: 75vh; display: none; 
            flex-direction: column; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .chat-header {
            background: #2ecc71; color: white; padding: 15px; text-align: center;
            font-family: 'Righteous', cursive; font-size: 1.5rem;
        }
        #messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { background: #e1f5fe; color: #2c3e50; padding: 10px 15px; border-radius: 15px; align-self: flex-start; max-width: 80%; }
        .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; gap: 10px; }
        #messageInput { flex-grow: 1; padding: 12px; border: 2px solid #ddd; border-radius: 25px; outline: none; }
        button { background: #2ecc71; color: white; border: none; border-radius: 25px; padding: 10px 20px; font-family: 'Righteous', cursive; cursor: pointer; }

        #ad-container-web {
            width: 100%; max-width: 600px; text-align: center;
            background: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 5px; display: none; 
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h3>BIENVENIDO A VIBEZMATCH</h3>
        <p>¿Cómo quieres que te llamen?</p>
        <input type="text" id="userNameInput" placeholder="Tu nombre o nick..." autocomplete="off">
        <br>
        <button onclick="startChat()">ENTRAR AL CHAT</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-header">VIBEZMATCH CHAT SOCIAL</div>
        <div id="messages-area">
            <div class="message-bubble" id="welcome-msg" style="background:#d4edda;">Conectando...</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
            <button onclick="sendMessage()">ENVIAR</button>
        </div>
    </div>

    <div id="ad-container-web">
        <p style="font-size: 10px; color: #666; margin: 2px;">Publicidad</p>
        <div style="width: 100%; height: 90px; background: #eee; border: 1px dashed #ccc; line-height: 90px; color: #999;">
            Bloque de Anuncio (AdSense)
        </div>
    </div>

    <a href="admin_console_debug.html" style="display:none;" id="honeypot-link-chat" aria-hidden="true">Debug Console</a>

    <!-- SDKs de Firebase (Firestore en lugar de Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-check-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            databaseURL: "https://vibezmatch-91c6d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.firebasestorage.app",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a",
            measurementId: "G-JKN6EBRHWZ"
        };

        firebase.initializeApp(firebaseConfig);
        const appCheck = firebase.appCheck();
        appCheck.activate('6LcbjugsAAAAALn_rfa17k5KG2Wbvv8QKl4Zm-ZT', true);

        // ✅ Usamos Firestore para sincronizar con la App móvil
        const db = firebase.firestore();

        let currentUsername = ""; 

        function startChat() {
            const nameInput = document.getElementById('userNameInput');
            const name = nameInput.value.trim();
            
            if (name !== "") {
                currentUsername = name;
                document.getElementById('login-screen').style.display = 'none'; 
                document.getElementById('chatContainer').style.display = 'flex'; 
                document.getElementById('ad-container-web').style.display = 'block'; 
                document.getElementById('welcome-msg').innerText = "¡Bienvenid@ " + currentUsername + "!";
                
                escucharMensajes();
            } else {
                alert("Por favor, dinos tu nombre para poder chatear.");
            }
        }

        // ✅ Corregido: envía a 'chat_global' con las claves 'usuario' y 'texto'
        function sendMessage() {
            const inputField = document.getElementById('messageInput');
            const text = inputField.value.trim();
            
            if (text !== '') {
                db.collection("chat_global").add({
                    texto: text,
                    usuario: currentUsername,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    inputField.value = '';
                });
            }
        }

        function escucharMensajes() {
            // Escuchamos los mensajes de las últimas 24 horas ordenados por tiempo
            const limite = new Date();
            limite.setDate(limite.getDate() - 1);

            db.collection("chat_global")
              .where("timestamp", ">=", limite)
              .orderBy("timestamp", "asc")
              .onSnapshot((snapshot) => {
                  snapshot.docChanges().forEach((change) => {
                      if (change.type === "added") {
                          const msgData = change.doc.data();
                          // Solo mostramos si tiene los campos que usa la app
                          if (msgData.usuario && msgData.texto) {
                              const msgDiv = document.createElement('div');
                              msgDiv.classList.add('message-bubble');
                              msgDiv.innerHTML = `<strong>${msgData.usuario}:</strong> ${msgData.texto}`;
                              const area = document.getElementById('messages-area');
                              area.appendChild(msgDiv);
                              area.scrollTop = area.scrollHeight;
                          }
                      }
                  });
              });
        }

        // --- CAPAS DE SEGURIDAD AMY SOFTWARE ---
        (function() {
            setInterval(function() {
                const startTime = performance.now();
                debugger; 
                if (performance.now() - startTime > 100) {
                    db.collection('security_alerts').add({
                        event_type: "chat_debug_attempt",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            }, 1000);
        })();

        document.getElementById("userNameInput").addEventListener("keyup", (e) => { if (e.key === "Enter") startChat(); });
        document.getElementById("messageInput").addEventListener("keyup", (e) => { if (e.key === "Enter") sendMessage(); });

        console.log("%cProtección de Chat Activa - Sincronizado con App Móvil", "color: #764ba2; font-weight: bold;");
    </script>
</body>
</html>

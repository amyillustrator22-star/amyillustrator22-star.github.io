<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibezMatch - Chat Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; overflow: hidden; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        #messages-area { height: calc(100vh - 140px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 80%; padding: 12px; border-radius: 15px; background: rgba(255,255,255,0.1); font-size: 0.9rem; align-self: flex-start; }
        .message-bubble.me { background: #22c55e; color: white; align-self: flex-end; }
        .message-bubble strong { display: block; font-size: 0.7rem; color: #4ade80; margin-bottom: 4px; }
        .message-bubble.me strong { color: rgba(255,255,255,0.7); }
        input:focus { outline: none; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header del Chat -->
    <header class="glass p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-white/50 hover:text-white">← Volver</a>
            <h1 class="font-righteous text-green-400">VibezMatch Chat</h1>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded-lg border border-red-500/30">Cerrar Sesión</button>
    </header>

    <!-- Área de Mensajes -->
    <div id="messages-area" class="flex-1">
        <div class="text-center text-white/20 text-xs py-10">Conexión cifrada establecida con Amy Software...</div>
    </div>

    <!-- Barra de Entrada -->
    <div class="glass p-4 flex gap-2">
        <input type="text" id="messageInput" placeholder="Escribe un mensaje..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-sm">
        <button onclick="sendMessage()" class="bg-green-500 hover:bg-green-400 text-white px-6 py-2 rounded-xl font-bold transition-all">Enviar</button>
    </div>

    <!-- Firebase y Lógica -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.firebasestorage.app",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = "index.html"; }
            else { escucharMensajes(); }
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const user = auth.currentUser;
            if (input.value.trim() !== '' && user) {
                db.collection("chat_global").add({
                    texto: input.value.trim(),
                    usuario: user.displayName || "Anónimo",
                    uid: user.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                input.value = '';
            }
        }

        function escucharMensajes() {
            db.collection("chat_global").orderBy("timestamp", "asc").limitToLast(50)
                .onSnapshot((snapshot) => {
                    const area = document.getElementById('messages-area');
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const d = change.doc.data();
                            const div = document.createElement('div');
                            div.classList.add('message-bubble');
                            if (d.uid === auth.currentUser.uid) div.classList.add('me');
                            div.innerHTML = `<strong>${d.usuario}</strong>${d.texto}`;
                            area.appendChild(div);
                            area.scrollTop = area.scrollHeight;
                        }
                    });
                });
        }

        function logout() { auth.signOut(); }

        // Mantenemos tu protección
        (function() {
            setInterval(function() {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 100) {
                    db.collection('security_alerts').add({ event_type: "chat_debug_attempt", timestamp: new Date() });
                }
            }, 1000);
        })();
    </script>
</body>
</html>

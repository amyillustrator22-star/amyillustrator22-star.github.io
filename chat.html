<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibezMatch - Chat Room Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const response = await fetch('/__/firebase/init.json');
        const firebaseConfig = await response.json();
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let unsubscribeChat = null;
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const banRef = doc(db, 'usuarios_baneados', user.uid);
                const banSnap = await getDoc(banRef);
                
                if (banSnap.exists()) {
                    alert("Tu cuenta ha sido suspendida.");
                    await signOut(auth);
                    window.location.reload();
                    return;
                }

                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('rules-modal').classList.remove('hidden');
            } else {
                currentUser = null;
                if (unsubscribeChat) unsubscribeChat();
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('chat-container').classList.add('hidden');
                document.getElementById('rules-modal').classList.add('hidden');
            }
        });

        window.handleAuthSubmit = async function() {
            console.log("¡Ejecutando lógica de Auth!");
            const hpValue = document.getElementById('validation_code_hp').value;
            if (hpValue) return;

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            console.log("Procesando Auth para:", email);
            
            const isLogin = currentMode === 'login';

            try {
                if (currentMode === 'recovery') {
                    await sendPasswordResetEmail(auth, email);
                    alert("Enlace de recuperación enviado.");
                    resetToLoginTab();
                } else if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error("Error Firebase:", error);
                alert("Error: " + error.message);
            }
        };

        window.handleAuthSubmitDirect = function() {
            console.log("¡Clic directo detectado!");
            handleAuthSubmit();
        };

        window.logout = async function() { await signOut(auth); };
        window.acceptRulesAndEnter = function() {
            document.getElementById('rules-modal').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            loadMessages();
        };

        function loadMessages() {
            const messagesRef = collection(db, 'chat_global');
            const q = query(messagesRef, orderBy('timestamp', 'asc'), limit(75));
            const chatMessagesDiv = document.getElementById('chat-messages');

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatMessagesDiv.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isMine = data.uid === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.innerHTML = `<p>${escapeHTML(data.text)}</p>`;
                    chatMessagesDiv.appendChild(msgDiv);
                });
                chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
            });
        }

        window.handleSendMessage = async function(e) {
            e.preventDefault();
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;
            input.value = ''; 
            await addDoc(collection(db, 'chat_global'), { text, uid: currentUser.uid, timestamp: serverTimestamp() });
        };

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="auth-container" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
        <input type="email" id="auth-email" placeholder="Correo" class="w-full p-2 border mb-4">
        <input type="password" id="auth-password" placeholder="Contraseña" class="w-full p-2 border mb-4">
        <input type="text" id="validation_code_hp" class="hidden">
        <button onclick="handleAuthSubmitDirect()" id="auth-submit-btn" class="w-full bg-black text-white p-2 rounded">Iniciar Sesión</button>
    </div>

    <div id="rules-modal" class="hidden">...</div>
    <div id="chat-container" class="hidden">...</div>

    <script>
        let currentMode = 'login';
        console.log("El script ha cargado correctamente");
    </script>
</body>
</html>

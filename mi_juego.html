<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Juego de Brain Training de Burbujas</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05101A;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Tu firma de seguridad: Honeypot totalmente invisible para humanos */
        .hp-field { 
            position: absolute; 
            left: -9999px; 
            top: -9999px; 
            width: 1px; 
            height: 1px; 
            overflow: hidden; 
            opacity: 0; 
            pointer-events: none; 
        }

        #cyber-hud {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 213, 0.2);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 213, 0.05);
        }

        .hud-label {
            font-size: 11px;
            color: rgba(0, 255, 213, 0.6);
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 20px;
            font-weight: bold;
            color: #00FFD5;
            text-shadow: 0 0 8px rgba(0, 255, 213, 0.5);
        }

        #game-container {
            width: 90vw;
            max-width: 600px;
            height: 55vh;
            max-height: 500px;
            background-color: #000000;
            border: 2px solid #00FFD5;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 255, 213, 0.1);
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #00FFD5;
            background: rgba(0, 255, 213, 0.1);
            color: #00FFD5;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 213, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
            animation: floatBobbing 4s ease-in-out infinite alternate;
        }

        .bubble:hover {
            background: rgba(0, 255, 213, 0.25);
            transform: scale(1.05);
        }

        .bubble:active {
            transform: scale(0.95);
        }

        #instruction {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-back-container {
            margin-top: 20px;
        }
        .btn-cyber-back {
            background: transparent;
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #ff0055;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-cyber-back:hover {
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        @keyframes floatBobbing {
            0% { margin-top: 0px; }
            100% { margin-top: 8px; }
        }

        .glitch-error {
            animation: flashRed 0.2s ease-in-out 2;
        }

        @keyframes flashRed {
            0% { border-color: #00FFD5; background-color: transparent; }
            50% { border-color: #ff0055; background-color: rgba(255, 0, 85, 0.2); }
            100% { border-color: #00FFD5; background-color: transparent; }
        }
    </style>
</head>
<body>

    <input type="text" id="arcade_security_hp" class="hp-field" tabindex="-1" autocomplete="off">

    <div id="cyber-hud">
        <div>
            <div class="hud-label">SECUENCIA ACTIVA</div>
            <div id="level-display" class="hud-value">FASE 01</div>
        </div>
        <div style="text-align: right;">
            <div class="hud-label">EDAD MENTAL ESTIMADA</div>
            <div id="age-display" class="hud-value">35 AÑOS</div>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="instruction">ORDENA LOS PATRONES NUMÉRICOS: PULSA DE MENOR A MAYOR ⬆</div>

    <div class="btn-back-container">
        <a href="/" class="btn-cyber-back">❌ ABANDONAR ENTRENAMIENTO</a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
        authDomain: "vibezmatch-91c6d.firebaseapp.com",
        databaseURL: "https://vibezmatch-91c6d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "vibezmatch-91c6d",
        storageBucket: "vibezmatch-91c6d.appspot.com",
        messagingSenderId: "645008717503",
        appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const container = document.getElementById('game-container');
    const ageDisplay = document.getElementById('age-display');
    const levelDisplay = document.getElementById('level-display');
    const botTrap = document.getElementById('arcade_security_hp');

    let mentalAge = 35;
    let currentLevel = 1;
    let numbersInRound = [];
    let bubblesCount = 4; 
    let processingGameOver = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) { }
    }

    function initRound() {
        if (processingGameOver) return;
        if (botTrap.value) {
            handleBotDetection();
            return;
        }

        container.innerHTML = '';
        numbersInRound = [];
        
        bubblesCount = Math.min(3 + currentLevel, 8);
        levelDisplay.innerText = `FASE ${String(currentLevel).padStart(2, '0')}`;

        while(numbersInRound.length < bubblesCount) {
            let num = Math.floor(Math.random() * 99) + 1;
            if(!numbersInRound.includes(num)) {
                numbersInRound.push(num);
            }
        }

        numbersInRound.forEach(num => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = num;
            bubble.dataset.value = num;

            const posX = Math.random() * (container.clientWidth - 80);
            const posY = Math.random() * (container.clientHeight - 80);
            
            bubble.style.left = `${posX}px`;
            bubble.style.top = `${posY}px`;
            
            bubble.style.animationDelay = `${Math.random() * 2}s`;

            bubble.addEventListener('click', () => checkSelection(bubble, num));
            container.appendChild(bubble);
        });
    }

    function getCountryFlag() {
        try {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.includes('ES')) return '🇪🇸';
            if (userLang.includes('AR')) return '🇦🇷';
            if (userLang.includes('MX')) return '🇲🇽';
            if (userLang.includes('CO')) return '🇨🇴';
            if (userLang.includes('CL')) return '🇨🇱';
            if (userLang.includes('PE')) return '🇵🇪';
            if (userLang.includes('US')) return '🇺🇸';
            return '🇪🇸';
        } catch (e) {
            return '🇪🇸';
        }
    }

    // SUBIDA DIRECTA BLINDADA (Frena cuelgues de índices de lectura)
    async function ejecutarGameOverDirecto() {
        processingGameOver = true;
        container.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#FF0055; font-weight:bold; letter-spacing:1px; text-align:center; padding:20px;">
                <div>💥 ¡ERROR SECUENCIAL! GAME OVER 💥</div>
            </div>
        `;

        setTimeout(async () => {
            const alias = prompt(`🏁 FIN DEL ENTRENAMIENTO\nHas alcanzado la Fase ${currentLevel}.\nIntroduce tu nombre para guardar tu récord mundial:`);
            
            if (alias && alias.trim() !== "") {
                try {
                    const flag = getCountryFlag();
                    await addDoc(collection(db, "scores_arcade"), {
                        player: alias.trim(),
                        score: currentLevel,
                        game: "brain_training",
                        country: flag
                    });
                } catch (err) {
                    console.error("Error al subir:", err);
                }
            }
            window.location.href = "/";
        }, 600);
    }

    function checkSelection(element, value) {
        if (botTrap.value || processingGameOver) {
            handleBotDetection();
            return;
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const minRemaining = Math.min(...numbersInRound);

        if (value === minRemaining) {
            numbersInRound = numbersInRound.filter(n => n !== value);
            element.style.transform = 'scale(0)';
            element.style.opacity = '0';
            
            playSound(600 + (value * 5), 'sine', 0.1);

            setTimeout(() => element.remove(), 100);

            if (numbersInRound.length === 0) {
                playSound(880, 'sine', 0.15);
                setTimeout(() => playSound(1200, 'sine', 0.2), 100);
                
                currentLevel++;
                mentalAge = Math.max(15, mentalAge - 1);
                ageDisplay.innerText = `${mentalAge} AÑOS`;
                
                setTimeout(initRound, 600);
            }
        } else {
            // MUERTE SÚBITA: Al primer fallo, sonido de error y Game Over directo
            playSound(120, 'sawtooth', 0.3);
            container.classList.add('glitch-error');
            ejecutarGameOverDirecto();
        }
    }

    function handleBotDetection() {
        playSound(80, 'sawtooth', 1.0);
        container.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#ff0055; font-weight:bold; letter-spacing:2px; text-align:center; padding:20px;">
                <div>⚠️ ERROR CRÍTICO DE SISTEMA ⚠️</div>
                <div style="font-size:11px; color:rgba(255,0,85,0.6); margin-top:15px; font-family:monospace;">ALGORITMO NO HUMANO DETECTADO.<br>ACCESO TERMINAL SUSPENDIDO.</div>
            </div>
        `;
        container.style.borderColor = '#ff0055';
        container.style.boxShadow = '0 0 25px rgba(255, 0, 85, 0.3)';
        levelDisplay.innerText = "BLOQUEADO";
        levelDisplay.style.color = "#ff0055";
        ageDisplay.innerText = "99 AÑOS";
        ageDisplay.style.color = "#ff0055";
        document.getElementById('instruction').innerText = "PROTECCIÓN ANTIMALWARE ACTIVA - AMY SOFTWARE CO.";
        document.getElementById('instruction').style.color = "#ff0055";
    }

    initRound();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLOCK</title>
    <style>
        body { 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #fff; 
            font-family: monospace; 
            overflow: hidden; 
        }
        
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Canvas adaptativo */
        canvas { 
            border: 2px solid #555; 
            background: #000; 
            width: 90vw; /* Se expande en el móvil */
            max-width: 320px; /* Tope de tamaño para el ordenador */
            height: auto; 
            aspect-ratio: 12 / 20; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .ui { text-align: center; margin-bottom: 10px; }
        h2 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        p { margin: 5px 0; font-size: 1.2rem; }
        
        /* Botones táctiles para el móvil */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 90vw;
            max-width: 320px;
        }
        .btn {
            background: #333;
            border: 2px solid #555;
            color: white;
            padding: 15px 0;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation; /* Evita que el móvil haga zoom al pulsar rápido */
        }
        .btn:active { background: #666; }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; }
        #btn-down { grid-column: 2; }
        #btn-right { grid-column: 3; }

        .system-validate-field { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

<div class="system-validate-field" aria-hidden="true">
    <input type="text" id="auth_token_verification" tabindex="-1" autocomplete="off">
</div>

<div id="game-container">
    <div class="ui">
        <h2>BLOCK</h2>
        <p>Puntos: <span id="display-score">0</span></p>
    </div>

    <canvas id="game" width="240" height="400"></canvas>

    <div class="controls">
        <div></div>
        <button class="btn" id="btn-up">↻</button>
        <div></div>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-down">↓</button>
        <button class="btn" id="btn-right">→</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.scale(20, 20);

    // Paleta de colores agradables para cada pieza
    const colors = [
        null,
        '#FF6B6B', // 1: Rojo suave (T)
        '#4ECDC4', // 2: Turquesa (Cuadrado)
        '#45B7D1', // 3: Azul (L)
        '#FFA07A', // 4: Salmón (L invertida)
        '#98D8C8', // 5: Menta (Palo)
        '#F7DC6F', // 6: Amarillo (S)
        '#BB8FCE'  // 7: Morado (Z)
    ];

    let securityTriggered = false;
    window.block_points = 0; 
    let _realInternalPointsCounter = 0; 

    function checkIntegrity() {
        const botInput = document.getElementById('auth_token_verification').value;
        if (botInput !== "" || window.block_points !== 0) {
            securityTriggered = true;
        }
    }

    function triggerTrap() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = '1px monospace';
        ctx.fillText("S1ST3M4 L0CK", 1, 5);
        ctx.fillText("ANOMALY DETECTED", 0.5, 7);
    }

    // Definición de las 7 matrices base
    function createPiece(type) {
        if (type === 'T') return [[0,0,0], [1,1,1], [0,1,0]];
        if (type === 'O') return [[2,2], [2,2]];
        if (type === 'L') return [[0,3,0], [0,3,0], [0,3,3]];
        if (type === 'J') return [[0,4,0], [0,4,0], [4,4,0]];
        if (type === 'I') return [[0,5,0,0], [0,5,0,0], [0,5,0,0], [0,5,0,0]];
        if (type === 'S') return [[0,6,6], [6,6,0], [0,0,0]];
        if (type === 'Z') return [[7,7,0], [0,7,7], [0,0,0]];
    }

    // Selector aleatorio de piezas
    function getRandomPiece() {
        const pieces = 'TOLJISZ';
        return createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null };

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value]; 
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    // Borde sutil para separar los cuadraditos de la pieza
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 0.05); 
                    ctx.fillRect(x + offset.x, y + offset.y, 0.05, 1); 
                }
            });
        });
    }

    // --- SISTEMA DE ROTACIÓN ---
    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir); // Cancela si no cabe
                player.pos.x = pos;
                return;
            }
        }
    }
    // ---------------------------

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            lineClear();
            playerReset();
        }
    }

    function playerReset() {
        player.matrix = getRandomPiece();
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        // Game Over
        if (collide(arena, player)) {
            arena.forEach(row => row.fill(0));
            _realInternalPointsCounter = 0;
            document.getElementById('display-score').innerText = 0;
        }
    }

    function addPoints(amount) {
        checkIntegrity();
        if (securityTriggered) return;
        _realInternalPointsCounter += amount;
        document.getElementById('display-score').innerText = _realInternalPointsCounter;
    }

    function lineClear() {
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            addPoints(10); 
        }
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    // Eventos de teclado (Para Linux Mint)
    document.addEventListener('keydown', event => {
        if (securityTriggered) return;
        if (event.keyCode === 37) playerMove(-1);
        else if (event.keyCode === 39) playerMove(1);
        else if (event.keyCode === 40) playerDrop();
        else if (event.keyCode === 38) playerRotate(1); // Flecha arriba para rotar
    });

    // Eventos táctiles (Para el móvil)
    document.getElementById('btn-left').addEventListener('click', () => { if (!securityTriggered) playerMove(-1); });
    document.getElementById('btn-right').addEventListener('click', () => { if (!securityTriggered) playerMove(1); });
    document.getElementById('btn-down').addEventListener('click', () => { if (!securityTriggered) playerDrop(); });
    document.getElementById('btn-up').addEventListener('click', () => { if (!securityTriggered) playerRotate(1); });

    function update() {
        checkIntegrity();
        if (securityTriggered) { triggerTrap(); return; }
        playerDrop();
        draw();
        setTimeout(update, 1000); 
    }

    // Inicializar primera pieza y arrancar
    playerReset();
    update();
</script>
</body>
</html>

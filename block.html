<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLOCK - Arcade Edition</title>
    <style>
        /* Fondo con tu imagen personalizada de la ciudad vintage */
        body { 
            background-image: url('fondotetris.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
        }
        
        /* Contenedor translúcido optimizado para PC y Móvil */
        #game-wrapper {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 95vw;
            max-width: 420px; 
        }

        /* Tablero con Neón Cian - Edge to Edge corregido para Tetris */
        canvas { 
            border: 2px solid rgba(78, 205, 196, 0.6); 
            background-color: rgba(10, 10, 25, 0.88); 
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.25);
            
            /* Lógica responsiva táctil */
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            aspect-ratio: 10 / 20 !important; /* Mantiene el rectángulo perfecto */
            object-fit: contain;
            touch-action: none;
        }

        .ui { 
            text-align: center; 
            margin-bottom: 15px; 
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        h2 { margin: 0; font-size: 1.8rem; letter-spacing: 3px; color: #0ff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        .stats { font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px;}
        
        /* Botón de Pausa Estilizado de forma independiente */
        .btn-pause {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            user-select: none;
            touch-action: manipulation;
        }
        .btn-pause:active { background: rgba(59, 130, 246, 0.5); color: white; }
        .btn-pause.active-mode { background: rgba(234, 179, 8, 0.3); border-color: #eab308; color: #fde047; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Controles móviles ajustados al nuevo tamaño */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            width: 100%;
            max-width: 260px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 1.5rem;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: background 0.2s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; }
        #btn-down { grid-column: 2; }
        #btn-right { grid-column: 3; }

        /* Botón de Salida Superior solicitado con Tailwind integrado */
        .btn-exit {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 15px;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .btn-exit:hover { background: rgba(239, 68, 68, 0.4); color: white; }

        /* HONEYPOT VISUAL TRAMPA (No tocar) */
        .system-validate-field { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

<div class="system-validate-field" aria-hidden="true">
    <input type="text" id="auth_token_verification" tabindex="-1" autocomplete="off">
</div>

<div id="game-wrapper">
    <div class="w-full flex justify-between items-center mb-2" style="width: 100%; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 380px;">
        <a href="juegos.html" class="btn-exit" style="margin-bottom: 0;">⬅ VOLVER</a>
        <button id="btn-pause" class="btn-pause">⏸ PAUSA</button>
    </div>

    <div class="ui" style="margin-top: 10px;">
        <div class="stats">NIVEL<br><span id="display-level">0</span></div>
        <h2>BLOCK</h2>
        <div class="stats">PTS<br><span id="display-score">0</span></div>
    </div>

    <canvas id="game" width="200" height="400"></canvas>

    <div class="controls">
        <div></div>
        <button class="btn" id="btn-up">↻</button>
        <div></div>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-down">↓</button>
        <button class="btn" id="btn-right">→</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
        authDomain: "vibezmatch-91c6d.firebaseapp.com",
        databaseURL: "https://vibezmatch-91c6d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "vibezmatch-91c6d",
        storageBucket: "vibezmatch-91c6d.appspot.com",
        messagingSenderId: "645008717503",
        appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.scale(20, 20);

    const colors = [null, '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE'];

    // --- SISTEMA DE AUDIO NATIVO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAudioTone(freq, type, duration, volume = 0.05) {
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // --- SISTEMA DE SEGURIDAD Y HONEYPOTS INTACTOS ---
    let securityTriggered = false;
    window.block_points = 0; // TRAMPA DE SEGURIDAD 2 (Variable cebo global)
    let _realInternalPointsCounter = 0; 
    let _linesCleared = 0;
    let _level = 0;
    let isGameOver = false; // Freno de control de estado de juego
    let isPaused = false;   // Variable de control para el estado de pausa solicitado

    function checkIntegrity() {
        const botInput = document.getElementById('auth_token_verification').value;
        if (botInput !== "" || window.block_points !== 0) securityTriggered = true;
    }

    function triggerTrap() {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = '1px monospace';
        ctx.fillText("S1ST3M4 L0CK", 0.5, 5);
        ctx.fillText("ANOMALY DETECTED", 0, 7);
    }
    // -------------------------------------------------

    function createPiece(type) {
        if (type === 'T') return [[0,1,0], [1,1,1], [0,0,0]];
        if (type === 'O') return [[2,2], [2,2]];
        if (type === 'L') return [[0,3,0], [0,3,0], [0,3,3]];
        if (type === 'J') return [[0,4,0], [0,4,0], [4,4,0]];
        if (type === 'I') return [[0,5,0,0], [0,5,0,0], [0,5,0,0], [0,5,0,0]];
        if (type === 'S') return [[0,6,6], [6,6,0], [0,0,0]];
        if (type === 'Z') return [[7,7,0], [0,7,7], [0,0,0]];
    }

    let pieceBag = [];
    function getRandomPiece() {
        if (pieceBag.length === 0) {
            pieceBag = ['T', 'O', 'L', 'J', 'I', 'S', 'Z'];
            for (let i = pieceBag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieceBag[i], pieceBag[j]] = [pieceBag[j], pieceBag[i]];
            }
        }
        return createPiece(pieceBag.pop());
    }

    const arena = createMatrix(10, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null };

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    let dropFast = false;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.09)';
        ctx.lineWidth = 0.04;
        for (let x = 0; x <= 10; x++) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 20);
            ctx.stroke();
        }
        for (let y = 0; y <= 20; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(10, y);
            ctx.stroke();
        }

        drawMatrix(arena, {x: 0, y: 0});
        if (player.matrix) drawMatrix(player.matrix, player.pos);

        if (isPaused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, 10, 20);
            ctx.fillStyle = '#0ffff0';
            ctx.font = '0.9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN", 5, 9.5);
            ctx.fillText("PAUSA", 5, 11);
        }
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value]; 
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1); 
                    ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1); 
                }
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerRotate(dir) {
        if (!player.matrix || isGameOver || isPaused) return;
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
        playAudioTone(330, 'sine', 0.05, 0.04); 
    }

    function playerMove(dir) {
        if (!player.matrix || isGameOver || isPaused) return;
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        } else {
            playAudioTone(220, 'sine', 0.04, 0.03); 
        }
    }

    function playerDrop() {
        if (!player.matrix || isGameOver || isPaused) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playAudioTone(120, 'triangle', 0.1, 0.08); 
            lineClear();
            playerReset();
        }
    }

    function getCountryFlag() {
        try {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.includes('ES')) return '🇪🇸';
            if (userLang.includes('AR')) return '🇦🇷';
            if (userLang.includes('MX')) return '🇲🇽';
            if (userLang.includes('CO')) return '🇨🇴';
            if (userLang.includes('CL')) return '🇨🇱';
            if (userLang.includes('PE')) return '🇵🇪';
            if (userLang.includes('US')) return '🇺🇸';
            return '🇪🇸';
        } catch (e) {
            return '🇪🇸';
        }
    }

    async function handleGameOver() {
        isGameOver = true;
        
        playAudioTone(180, 'sawtooth', 0.3, 0.08);
        setTimeout(() => playAudioTone(150, 'sawtooth', 0.3, 0.08), 200);
        setTimeout(() => playAudioTone(110, 'sawtooth', 0.5, 0.08), 400);

        setTimeout(async () => {
            const playerName = prompt(`🎮 ¡FIN DE LA PARTIDA!\nHas conseguido ${_realInternalPointsCounter} puntos.\nIntroduce tu nombre para el Ranking Mundial:`);
            
            if (playerName && playerName.trim() !== "") {
                try {
                    const userFlag = getCountryFlag();
                    await addDoc(collection(db, "scores_arcade"), {
                        player: playerName.trim(),
                        score: _realInternalPointsCounter,
                        game: "block",
                        country: userFlag
                    });
                    alert("🏆 ¡Puntuación registrada con éxito!");
                } catch (error) {
                    console.error("Error guardando record:", error);
                }
            }
            window.location.href = "juegos.html";
        }, 800);
    }

    function playerReset() {
        player.matrix = getRandomPiece();
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        
        if (collide(arena, player)) {
            handleGameOver();
        }
    }

    function updateUI() {
        document.getElementById('display-score').innerText = _realInternalPointsCounter;
        document.getElementById('display-level').innerText = _level;
    }

    function addScore(lines) {
        document.getElementById('auth_token_verification').value;
        if (window.block_points !== 0) securityTriggered = true;
        if (securityTriggered) return;
        let basePoints = [0, 40, 100, 300, 1200][lines] || 0;
        _realInternalPointsCounter += basePoints * (_level + 1);
        _linesCleared += lines;
        _level = Math.floor(_linesCleared / 10); 
        updateUI();
    }

    function lineClear() {
        let linesCount = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            linesCount++;
        }
        if (linesCount > 0) {
            addScore(linesCount);
            playAudioTone(523.25, 'sine', 0.08, 0.06); 
            setTimeout(() => playAudioTone(659.25, 'sine', 0.08, 0.06), 60); 
            setTimeout(() => playAudioTone(783.99, 'sine', 0.15, 0.06), 120); 
        }
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    // --- FUNCIÓN DEL MANEJO DEL BOTÓN DE PAUSA ---
    window.togglePauseGame = function() {
        if (isGameOver || securityTriggered) return;
        
        isPaused = !isPaused;
        const btn = document.getElementById('btn-pause');
        
        if (isPaused) {
            btn.innerText = "▶ REANUDAR";
            btn.classList.add('active-mode');
            playAudioTone(290, 'sine', 0.12, 0.05);
            draw();
        } else {
            btn.innerText = "⏸ PAUSA";
            btn.classList.remove('active-mode');
            playAudioTone(440, 'sine', 0.08, 0.05);
            requestAnimationFrame(update);
        }
    };

    document.getElementById('btn-pause').addEventListener('click', togglePauseGame);
    // ---------------------------------------------

    document.addEventListener('keydown', event => {
        if (securityTriggered || isGameOver || isPaused) return;
        if (event.keyCode === 37) playerMove(-1);
        else if (event.keyCode === 39) playerMove(1);
        else if (event.keyCode === 40) dropFast = true; 
        else if (event.keyCode === 38) playerRotate(1);
    });

    document.addEventListener('keydown', event => {
        if (event.keyCode === 32) {
            event.preventDefault();
            togglePauseGame();
        }
    });

    document.addEventListener('keyup', event => {
        if (event.keyCode === 40) dropFast = false; 
    });

    const btnDown = document.getElementById('btn-down');
    
    btnDown.addEventListener('mousedown', () => { if (!securityTriggered && !isGameOver && !isPaused) dropFast = true; });
    btnDown.addEventListener('mouseup', () => { dropFast = false; });
    btnDown.addEventListener('mouseleave', () => { dropFast = false; });
    
    btnDown.addEventListener('touchstart', (e) => { 
        e.preventDefault(); 
        if (!securityTriggered && !isGameOver && !isPaused) dropFast = true; 
    }, { passive: false });
    btnDown.addEventListener('touchend', (e) => { 
        e.preventDefault(); 
        dropFast = false; 
    }, { passive: false });

    document.getElementById('btn-left').addEventListener('click', () => { if (!securityTriggered && !isPaused) playerMove(-1); });
    document.getElementById('btn-right').addEventListener('click', () => { if (!securityTriggered && !isPaused) playerMove(1); });
    document.getElementById('btn-up').addEventListener('click', () => { if (!securityTriggered && !isPaused) playerRotate(1); });

    function update(time = 0) {
        checkIntegrity();
        if (securityTriggered) { triggerTrap(); return; }
        if (isGameOver) return; 
        if (isPaused) return;
        
        let currentDropInterval = dropFast ? 40 : Math.max(100, 1000 - (_level * 100)); 
        
        if (time - lastTime > currentDropInterval) {
            playerDrop();
            lastTime = time;
        }
        draw();
        requestAnimationFrame(update);
    }

    let lastTime = 0;
    playerReset();
    update();
</script>
</body>
</html>

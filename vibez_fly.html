<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amy Software - Vibez Fly</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)), url('encabezaoAmySoftware.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            user-select: none;
            touch-action: manipulation;
        }
        .title-nabla {
            font-family: 'Nabla', cursive;
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 0px black;
        }
        #contenedor-juego {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 70vh;
            max-height: 700px;
            background-image: url('fondocorazon.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            display: flex;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-capa {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            pointer-events: none;
        }
        .hp-field { 
            position: absolute; left: -9999px; top: -9999px; 
            width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; 
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 font-sans text-gray-800">

    <input type="text" id="arcade_security_hp" class="hp-field" tabindex="-1" autocomplete="off">

    <header class="flex items-center gap-4 mb-4">
        <h1 class="title-nabla text-4xl drop-shadow-xl text-center text-white">
            VIBEZ FLY
        </h1>
    </header>

    <div id="contenedor-juego" class="rounded-[2.5rem] border-4 border-purple-500 shadow-2xl">
        <canvas id="canvasJuego"></canvas>
        
        <div id="ui-capa">
            <div id="puntuacion" class="text-6xl font-black text-black mb-auto drop-shadow-sm">0</div>
            
            <div id="pantalla-inicio" class="text-center mb-auto pointer-events-auto">
                <div class="text-red-600 text-2xl font-black tracking-wider bg-white/80 backdrop-blur-sm px-6 py-3 rounded-2xl border border-white/50 shadow-md">
                    VIBEZ FLY<br>TAP TO BOUNCE
                </div>
            </div>
            
            <div id="pantalla-gameover" class="text-center mb-auto pointer-events-auto hidden">
                <div id="texto-gameover" class="text-red-600 text-4xl font-black tracking-tight bg-white/80 backdrop-blur-sm px-6 py-4 rounded-3xl border border-white/50 shadow-md mb-6">
                    CORAZÓN ROTO
                </div>
                <button id="btn-reintentar" class="bg-red-600 hover:bg-red-700 active:scale-95 transition-transform text-white border-none px-6 py-3 text-lg font-bold rounded-2xl shadow-lg cursor-pointer">
                    SANAR Y REINTENTAR
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-6">
        <a href="juegos.html" class="inline-flex items-center justify-center px-6 py-3 font-bold text-white transition-all duration-200 bg-gray-900 rounded-xl hover:bg-gray-800 hover:-translate-y-0.5 shadow-md">
            Volver a Selección
        </a>
    </footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
        authDomain: "vibezmatch-91c6d.firebaseapp.com",
        databaseURL: "https://vibezmatch-91c6d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "vibezmatch-91c6d",
        storageBucket: "vibezmatch-91c6d.appspot.com",
        messagingSenderId: "645008717503",
        appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const canvas = document.getElementById("canvasJuego");
    const ctx = canvas.getContext("2d");
    const txtPuntuacion = document.getElementById("puntuacion");
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const pantallaGameOver = document.getElementById("pantalla-gameover");
    const btnReintentar = document.getElementById("btn-reintentar");
    const contenedor = document.getElementById("contenedor-juego");
    const botTrap = document.getElementById('arcade_security_hp');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration, endFreq = null) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (endFreq) {
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            }
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function redimensionar() {
        canvas.width = contenedor.clientWidth;
        canvas.height = contenedor.clientHeight;
    }
    window.addEventListener("resize", redimensionar);
    redimensionar();

    const GRAVEDAD = 0.4;
    const IMPULSO = -8;
    const VELOCIDAD_OBSTACULOS = 3;
    const HUECO_PASO = 250; 
    const RADIO_MASCOTA = 25;
    const ANCHO_BARRERA = 80; 

    let juegoIniciado = false, gameOver = false, puntuacion = 0;
    let mascotaY = 200, velocidadY = 0, obstaculos = [];
    let recordProcesado = false;

    function dibujarCorazon(centroX, centroY, roto) {
        ctx.fillStyle = "#ff0000";
        ctx.beginPath();
        ctx.arc(centroX-15, centroY, 20, 0, Math.PI * 2);
        ctx.arc(centroX+15, centroY, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(centroX-32, centroY+5);
        ctx.lineTo(centroX+32, centroY+5);
        ctx.lineTo(centroX, centroY+40);
        ctx.fill();
    }

    function crearObstaculo() {
        const margen = 80;
        const altoMax = canvas.height - HUECO_PASO - margen;
        const altoSuperior = Math.random() * (altoMax - margen) + margen;
        return { x: canvas.width, altoSuperior: altoSuperior, pasado: false };
    }

    function getCountryFlag() {
        try {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.includes('ES')) return '🇪🇸';
            if (userLang.includes('AR')) return '🇦🇷';
            if (userLang.includes('MX')) return '🇲🇽';
            if (userLang.includes('CO')) return '🇨🇴';
            if (userLang.includes('CL')) return '🇨🇱';
            if (userLang.includes('PE')) return '🇵🇪';
            if (userLang.includes('US')) return '🇺🇸';
            return '🇪🇸';
        } catch (e) {
            return '🇪🇸';
        }
    }

    // SUBIDA DIRECTA OPTIMIZADA SIN VERIFICACIÓN DE LECTURA PREVIA
    async function comprobarYRegistrarRanking() {
        if (recordProcesado) return;
        recordProcesado = true;

        setTimeout(async () => {
            const alias = prompt(`🎉 ¡FIN DE LA PARTIDA!\nTu récord: ${puntuacion} puntos.\nIntroduce tu nombre para la tabla mundial:`);
            
            if (alias && alias.trim() !== "") {
                try {
                    const bandera = getCountryFlag();
                    await addDoc(collection(db, "scores_arcade"), {
                        player: alias.trim(),
                        score: puntuacion,
                        game: "vibez_fly",
                        country: bandera
                    });
                } catch (err) {
                    console.error("Error al subir:", err);
                }
            }
            window.location.href = "juegos.html";
        }, 700);
    }

    function finalizarPartida() {
        gameOver = true; 
        pantallaGameOver.classList.remove("hidden"); 
        playSound(220, 'sawtooth', 0.4, 60);
        comprobarYRegistrarRanking();
    }

    function actualizarJuego() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (juegoIniciado && !gameOver) {
            velocidadY += GRAVEDAD;
            mascotaY += velocidadY;
            if (mascotaY > canvas.height || mascotaY < 0) { 
                finalizarPartida();
            }
            if (obstaculos.length === 0 || obstaculos[obstaculos.length-1].x < canvas.width - 280) obstaculos.push(crearObstaculo());
            obstaculos.forEach(obs => {
                obs.x -= VELOCIDAD_OBSTACULOS;
                
                if (!obs.pasado && obs.x + ANCHO_BARRERA < canvas.width/2) { 
                    obs.pasado = true; 
                    puntuacion++; 
                    txtPuntuacion.innerText = puntuacion; 
                    playSound(750, 'sine', 0.12); 
                }
                
                if (canvas.width/2 + 32 > obs.x && canvas.width/2 - 32 < obs.x + ANCHO_BARRERA) {
                    if (mascotaY - 20 < obs.altoSuperior || mascotaY + 40 > obs.altoSuperior + HUECO_PASO) {
                        finalizarPartida();
                    }
                }
            });
            obstaculos = obstaculos.filter(o => o.x > -100);
        }
        
        ctx.fillStyle = "#78909C";
        obstaculos.forEach(obs => {
            ctx.fillRect(obs.x, 0, ANCHO_BARRERA, obs.altoSuperior);
            ctx.fillRect(obs.x, obs.altoSuperior + HUECO_PASO, ANCHO_BARRERA, canvas.height);
        });
        dibujarCorazon(canvas.width / 2, mascotaY, gameOver);
        requestAnimationFrame(actualizarJuego);
    }

    contenedor.addEventListener("touchstart", (e) => { 
        if (gameOver) return;
        e.preventDefault(); 
        realizarSalto(); 
    }, { passive: false });
    
    contenedor.addEventListener("mousedown", () => {
        if (gameOver) return;
        realizarSalto();
    });
    
    function realizarSalto() { 
        if (botTrap.value) return; 

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (!gameOver) { 
            juegoIniciado = true; 
            pantallaInicio.classList.add("hidden"); 
            velocidadY = IMPULSO; 
            playSound(400, 'sine', 0.08, 600); 
        } 
    }

    btnReintentar.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation(); 
        mascotaY = 200; velocidadY = 0; obstaculos = []; puntuacion = 0;
        txtPuntuacion.innerText = "0"; gameOver = false; juegoIniciado = false; recordProcesado = false;
        pantallaGameOver.classList.add("hidden"); 
        pantallaInicio.classList.remove("hidden");
    });

    btnReintentar.addEventListener("touchstart", (e) => {
        e.preventDefault();
        e.stopPropagation(); 
        mascotaY = 200; velocidadY = 0; obstaculos = []; puntuacion = 0;
        txtPuntuacion.innerText = "0"; gameOver = false; juegoIniciado = false; recordProcesado = false;
        pantallaGameOver.classList.add("hidden"); 
        pantallaInicio.classList.remove("hidden");
    }, { passive: false });

    requestAnimationFrame(actualizarJuego);
</script>
</body>
</html>

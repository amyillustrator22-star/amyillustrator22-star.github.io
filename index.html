<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Software</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Tu logo arriba a la derecha */
        .top-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 4rem;
            margin-bottom: 40px;
            background: linear-gradient(to bottom, #114B0B, #2ECC71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.5));
            -webkit-text-stroke: 1px #000;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.1);
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            border-left: 5px solid #F1C40F;
            transition: transform 0.3s ease;
        }

        .app-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.15);
        }

        .app-title {
            font-weight: 800;
            color: #F1C40F;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <img src="AmySoftwareLogo.jpg" alt="Logo" class="top-logo">

    <div class="container">
        <h1>AMYSOFTWARE</h1>
        
        <div class="app-card">
            <div class="app-title">VIBEZMATCH</div>
            <p>Desarrollo Android Nativo</p>
        </div>

        <div class="app-card">
            <div class="app-title">DIETCHECK</div>
            <p>Innovación con QR y AI</p>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Software</title>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Righteous&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon-green: #4ade80; --neon-purple: #a855f7; }
        body { 
            font-family: 'Righteous', cursive; 
            background: #0f172a; 
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(74, 222, 128, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-title {
            font-family: 'Alfa Slab One', serif;
            background: linear-gradient(to bottom, #fff 30%, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(74, 222, 128, 0.5));
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-container {
            font-family: 'Alfa Slab One', serif;
            background: #000;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            text-shadow: 2px 2px 0px #ff007f;
        }
        .btn-neon { transition: all 0.3s ease; font-weight: bold; border: 1px solid; }
        .btn-green { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-green:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }
        .btn-purple { border-color: var(--neon-purple); color: var(--neon-purple); }
        .btn-purple:hover { background: var(--neon-purple); color: #fff; box-shadow: 0 0 20px var(--neon-purple); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="px-4 py-10">

    <header class="text-center mb-12">
        <h1 class="brand-title text-5xl md:text-7xl mb-2">AMY SOFTWARE</h1>
        <p class="text-green-400/80 tracking-widest text-sm uppercase">Cybernetic Protection Active</p>
    </header>

    <main class="w-full max-w-2xl space-y-6">
        <div class="glass-card rounded-3xl p-6 flex items-center justify-between border-b-2 border-green-500/50">
            <div>
                <h2 class="text-xl">System Dashboard</h2>
                <p class="text-white/40 text-sm">Escudo: <span class="text-green-400">Activado</span></p>
            </div>
            <div class="logo-container w-16 h-16 rounded-xl flex items-center justify-center text-2xl text-green-400 select-none">AΩ</div>
        </div>

        <div class="glass-card rounded-3xl p-6 hover:border-green-500/50 transition-colors">
            <h3 class="text-green-400 text-lg uppercase mb-2">VibezMatch</h3>
            <p class="text-white/70 mb-6">Acceso al canal de comunicación seguro.</p>
            <!-- He añadido un parámetro para forzar que el navegador no use caché al saltar al chat -->
            <a href="chat.html?v=amy" class="btn-neon btn-green block text-center py-3 rounded-xl no-underline">INICIAR PROTOCOLO</a>
        </div>

        <div class="glass-card rounded-3xl p-6 hover:border-purple-500/50 transition-colors">
            <h3 class="text-purple-400 text-lg uppercase mb-2">Zona de Juegos</h3>
            <button onclick="toggleModal('modal-juegos', true)" class="btn-neon btn-purple w-full py-3 rounded-xl cursor-pointer bg-transparent uppercase">ABRIR EXPEDIENTE</button>
        </div>
    </main>

    <!-- MODAL JUEGOS -->
    <div id="modal-juegos" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="glass-card w-full max-w-md rounded-3xl p-8 relative border-purple-500/50">
            <button onclick="toggleModal('modal-juegos', false)" class="absolute top-4 right-4 text-white/50 hover:text-white text-2xl cursor-pointer bg-transparent border-0">✕</button>
            <h3 class="text-purple-400 text-2xl mb-6 font-alfa text-center uppercase">Módulos</h3>
            <div class="grid grid-cols-1 gap-4">
                <div class="p-4 rounded-xl bg-white/5 border border-white/10 hover:bg-purple-500/20 cursor-pointer" onclick="alert('Iniciando...')">🎯 Cuestionario</div>
                <div class="p-4 rounded-xl bg-white/5 border border-white/10 hover:bg-purple-500/20 cursor-pointer" onclick="alert('Iniciando...')">🐍 Snake Cyberpunk</div>
            </div>
        </div>
    </div>

    <a href="admin_panel.html" style="display:none;" id="honeypot-link" aria-hidden="true">Acceso Admin</a>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.firebasestorage.app",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function toggleModal(id, show) {
            const m = document.getElementById(id);
            if(show) { m.classList.remove('hidden'); m.style.display = 'flex'; }
            else { m.classList.add('hidden'); m.style.display = 'none'; }
        }

        function logSecurityEvent(type) {
            db.collection('security_alerts').add({
                event_type: type,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                url: window.location.href
            }).catch(() => {});
        }

        (function() {
            setInterval(function() {
                const s = performance.now();
                debugger;
                if (performance.now() - s > 100) { logSecurityEvent("console_debug_detected"); }
            }, 1000);
        })();

        document.getElementById('honeypot-link').addEventListener('click', (e) => {
            e.preventDefault();
            logSecurityEvent("honeypot_link_clicked");
            alert("Acceso denegado.");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Software</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Fondo degradado vibrante y alegre */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* Tu nombre justo arriba de la ventana */
        .user-name {
            font-family: 'Syne', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1px #0b3d1c;
            filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.7));
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* La ventana blanca */
        .window {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 550px;
            position: relative;
            text-align: left; /* Contenido a la izquierda */
        }

        /* Tu logo de la serpiente y la A dentro de la ventana (arriba a la derecha) */
        .inner-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: auto;
            border-radius: 15px;
        }

        h2.section-title {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 2px solid #2ecc71;
            display: inline-block;
            padding-bottom: 5px;
        }

        .app-entry {
            margin-bottom: 20px;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 6px solid #2ecc71;
            transition: transform 0.2s ease;
        }

        .app-entry:hover {
            transform: translateX(10px);
        }

        .app-title {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.3rem;
            display: block;
            text-transform: uppercase;
        }

        .app-desc {
            color: #5d6d7e;
            font-size: 1rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Tu nombre fuera, justo arriba -->
    <div class="user-name">AMY SOFTWARE</div>

    <div class="window">
        <!-- Tu logo real dentro de la ventana -->
        <img src="AmySoftwareLogo.jpg" alt="Logo Amy Software" class="inner-logo">

        <h2 class="section-title">Aplicaciones disponibles</h2>
        
        <div class="app-entry">
            <span class="app-title">VibezMatch</span>
            <span class="app-desc">Encuentra tu pareja ideal basándote en la química y las vibras personales.</span>
        </div>

        <div class="app-entry">
            <span class="app-title">DietCheck</span>
            <span class="app-desc">Análisis inteligente de alimentos mediante escaneo QR e inteligencia artificial.</span>
        </div>
    </div>

</body>
</html>

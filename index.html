 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Software</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Fondo degradado más vivo y alegre */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .top-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 70px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 2px solid white;
        }

        /* La "Ventana" central */
        .window {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            margin: 0 0 30px 0;
            /* Verde más claro para que no se vea oscuro */
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Borde negro fino para legibilidad */
            -webkit-text-stroke: 1px #0b3d1c;
            /* El halo amarillo que pediste */
            filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.6));
            text-transform: uppercase;
        }

        .apps-container {
            text-align: left; /* Apps a la izquierda */
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .app-entry {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #2ecc71;
        }

        .app-title {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.1rem;
            display: block;
        }

        .app-desc {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <img src="AmySoftwareLogo.jpg" alt="Logo" class="top-logo">

    <div class="window">
        <h1>AMY SOFTWARE</h1>
        
        <div class="apps-container">
            <div class="app-entry">
                <span class="app-title">VibezMatch</span>
                <span class="app-desc">Desarrollo Android Nativo (Java 17)</span>
            </div>

            <div class="app-entry">
                <span class="app-title">DietCheck</span>
                <span class="app-desc">Escaneo QR e IA (Kotlin)</span>
            </div>
        </div>
    </div>

</body>
</html>

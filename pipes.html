<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipes - AmySoftware</title>
    
    <script>
        window.AMY_DICT = {
            "status_msg": {
                "es": "Juego en construcción, próximamente.",
                "en": "Game under construction, coming soon."
            }
        };
    </script>

    <script src="i18n.js"></script>

    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            color: #eceff1;
            letter-spacing: 0.5px;
        }

        /* Estilos ocultos para el Honeypot (trampa para bots de spam) */
        .visually-hidden-fields {
            position: absolute;
            left: -5000px;
            top: -5000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1 data-i18n="status_msg">Juego en construcción, próximamente.</h1>

    <div class="visually-hidden-fields" aria-hidden="true">
        <form action="#" method="POST" tabindex="-1">
            <label for="website_url">Do not fill this field if you are human:</label>
            <input type="text" id="website_url" name="website_url" autocomplete="off" tabindex="-1">
            <label for="honeypot_email">Leave empty:</label>
            <input type="email" id="honeypot_email" name="honeypot_email" autocomplete="off" tabindex="-1">
        </form>
    </div>

</body>
</html>

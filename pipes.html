<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipes - AmySoftware</title>
    
    <!-- 1. Diccionario de idiomas para Pipes -->
    <script>
        window.AMY_DICT = {
            "title": { "es": "Pipes", "en": "Pipes" },
            "timer_wait": { "es": "El agua fluye en: ", "en": "Water flows in: " },
            "flowing": { "es": "¡EL AGUA ESTÁ FLUYENDO!", "en": "WATER IS FLOWING!" },
            "instructions": { "es": "¡Toca las tuberías para rotarlas!", "en": "Tap pipes to rotate them!" },
            "btn_flow": { "es": "¡Fluir ya!", "en": "Flow Now!" },
            "win_msg": { "es": "🎉 ¡Excelente! ¡Circuito Conectado! 🎉", "en": "🎉 Excellent! Path Connected! 🎉" },
            "lose_msg": { "es": "❌ ¡Juego Terminado! ¡Fuga Detectada! ❌", "en": "❌ Game Over! Leak Detected! ❌" },
            "btn_retry": { "es": "Reintentar", "en": "Retry" }
        };
    </script>

    <!-- 2. Motor de idiomas -->
    <script src="i18n.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --grid-color: #111111;
            --pipe-dry: #ffeb3b;     /* Amarillo brillante para las tuberías secas */
            --pipe-wet: #00e5ff;     /* Cyan neón para el agua */
            --start-color: #4caf50;
            --end-color: #ff3d00;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('pipesfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
            touch-action: manipulation;
        }

        #ui-container {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            background-color: rgba(0, 0, 0, 0.6); /* Fondo semi-transparente para leer bien los textos sobre el fondo de colores */
            padding: 10px;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #fff;
            letter-spacing: 1px;
        }

        #timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
        }

        #status {
            font-size: 1rem;
            height: 2.5rem;
            color: #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: 92vw;
            max-width: 360px;
            aspect-ratio: 1;
            background-color: var(--grid-color);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.05);
            border: 2px solid #222;
        }

        .cell {
            background-color: #1e1e1e;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            border: 1px solid #2a2a2a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .cell svg {
            width: 100%;
            height: 100%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        /* Diseño de tubería gruesa y estilizada */
        .pipe-bg {
            fill: none;
            stroke: #0a0a0a;
            stroke-width: 24;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pipe-path {
            fill: none;
            stroke: var(--pipe-dry);
            stroke-width: 16;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        /* Animación y color del agua fluyendo */
        .pipe-path.wet {
            stroke: var(--pipe-wet);
            filter: drop-shadow(0 0 4px var(--pipe-wet));
        }

        /* Bordes distintivos para entrada y salida */
        .cell.start { background-color: #1b2e1c; border-color: var(--start-color); }
        .cell.end { background-color: #331c1a; border-color: var(--end-color); }
        
        .cell.start .pipe-path { stroke: var(--start-color); }
        .cell.end .pipe-path { stroke: var(--end-color); }
        .cell.start .pipe-path.wet, .cell.end .pipe-path.wet { stroke: var(--pipe-wet); }

        #btn-flow, .btn-action {
            margin-top: 25px;
            padding: 12px 28px;
            font-size: 1rem;
            background-color: #ffeb3b;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,235,59,0.2);
            transition: transform 0.1s;
        }

        #btn-flow:active, .btn-action:active {
            transform: scale(0.96);
        }

        .btn-action {
            margin-top: 10px;
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 18px;
            font-size: 0.9rem;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1 data-i18n="title">Pipes</h1>
        <div id="timer"></div>
        <div id="status" data-i18n="instructions">¡Toca las tuberías para rotarlas!</div>
    </div>

    <div id="grid-container"></div>

    <button id="btn-flow" onclick="triggerEarlyFlow()" data-i18n="btn_flow">¡Fluir ya!</button>

<script>
    const ROWS = 6;
    const COLS = 6;
    let grid = [];
    let startTime = 30;
    let timerInterval = null;
    let flowInterval = null;
    let isFlowing = false;
    let gameOver = false;

    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    const PIPE_TYPES = {
        'I': [true, false, true, false],
        'L': [true, true, false, false],
        'T': [true, true, false, true],
        'X': [true, true, true, true]
    };

    class Cell {
        constructor(r, c) {
            this.r = r;
            this.c = c;
            this.isStart = false;
            this.isEnd = false;
            this.type = 'I'; 
            this.rotation = 0; 
            this.wet = false;
        }

        getConnections() {
            const base = PIPE_TYPES[this.type];
            let actual = [false, false, false, false];
            for (let i = 0; i < 4; i++) {
                actual[(i + this.rotation) % 4] = base[i];
            }
            return actual;
        }

        rotate() {
            if (this.isStart || this.isEnd || isFlowing || gameOver) return;
            this.rotation = (this.rotation + 1) % 4;
            this.render();
        }

        render() {
            const el = document.getElementById(`cell-${this.r}-${this.c}`);
            if (!el) return;
            
            const svg = el.querySelector('svg');
            if (svg) {
                svg.style.transform = `rotate(${this.rotation * 90}deg)`;
                const paths = svg.querySelectorAll('.pipe-path');
                paths.forEach(p => {
                    if (this.wet) p.classList.add('wet');
                    else p.classList.remove('wet');
                });
            }
        }
    }

    function getPipeSVG(type) {
        let paths = '';
        if (type === 'I') paths = '<path class="pipe-bg" d="M 50 0 L 50 100" /><path class="pipe-path" d="M 50 0 L 50 100" />';
        if (type === 'L') paths = '<path class="pipe-bg" d="M 50 0 Q 50 50 100 50" /><path class="pipe-path" d="M 50 0 Q 50 50 100 50" />';
        if (type === 'T') paths = '<path class="pipe-bg" d="M 50 0 L 50 50 M 0 50 L 100 50" /><path class="pipe-path" d="M 50 0 L 50 50 M 0 50 L 100 50" />';
        if (type === 'X') paths = '<path class="pipe-bg" d="M 50 0 L 50 100 M 0 50 L 100 50" /><path class="pipe-path" d="M 50 0 L 50 100 M 0 50 L 100 50" />';
        return `<svg viewBox="0 0 100 100">${paths}</svg>`;
    }

    function initGame() {
        grid = [];
        isFlowing = false;
        gameOver = false;
        startTime = 30;
        
        document.getElementById('timer').innerText = `${window.t('timer_wait')}${startTime}s`;
        document.getElementById('status').innerText = window.t('instructions');
        document.getElementById('btn-flow').style.display = 'inline-block';

        const container = document.getElementById('grid-container');
        container.innerHTML = '';

        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = new Cell(r, c);
            }
        }

        // Fijar extremos en los bordes superiores e inferiores
        const startR = 0, startC = Math.floor(Math.random() * (COLS - 2)) + 1;
        const endR = ROWS - 1, endC = Math.floor(Math.random() * (COLS - 2)) + 1;

        grid[startR][startC].isStart = true;
        grid[startR][startC].type = 'I'; 
        grid[startR][startC].rotation = 0;

        grid[endR][endC].isEnd = true;
        grid[endR][endC].type = 'I';
        grid[endR][endC].rotation = 0;

        // Generar solución limpia sin interrupciones
        let solutionPath = [];
        generatePath(startR, startC, endR, endC, new Set([`${startR},${startC}`]), solutionPath);
        applyPathPipes(solutionPath);

        // Rellenar las celdas vacías con formas válidas aleatorias
        const types = ['I', 'L', 'T', 'X'];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cell = grid[r][c];
                const isSol = solutionPath.some(p => p.r === r && p.c === c);
                if (!isSol) {
                    cell.type = types[Math.floor(Math.random() * types.length)];
                }
                // Scramble: Rotación aleatoria inicial para desordenar el puzle al empezar
                if (!cell.isStart && !cell.isEnd) {
                    cell.rotation = Math.floor(Math.random() * 4);
                }
            }
        }

        // Renderizado e inyección del DOM
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = grid[r][c];
                const div = document.createElement('div');
                div.id = `cell-${r}-${c}`;
                div.className = `cell${cell.isStart ? ' start' : ''}${cell.isEnd ? ' end' : ''}`;
                div.innerHTML = getPipeSVG(cell.type);
                
                div.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    cell.rotate();
                });
                
                container.appendChild(div);
                cell.render();
            }
        }

        clearInterval(timerInterval);
        clearInterval(flowInterval);
        timerInterval = setInterval(() => {
            startTime--;
            if (startTime <= 0) {
                clearInterval(timerInterval);
                startWaterFlow();
            } else {
                document.getElementById('timer').innerText = `${window.t('timer_wait')}${startTime}s`;
            }
        }, 1000);
    }

    function generatePath(r, c, er, ec, visited, path) {
        if (r === er && c === ec) {
            path.push({r, c});
            return true;
        }
        let dirs = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
        for (let d of dirs) {
            let nr = r + DY[d];
            let nc = c + DX[d];
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(`${nr},${nc}`)) {
                visited.add(`${nr},${nc}`);
                path.push({r, c});
                if (generatePath(nr, nc, er, ec, visited, path)) return true;
                path.pop();
                visited.delete(`${nr},${nc}`);
            }
        }
        return false;
    }

    function applyPathPipes(path) {
        for (let i = 1; i < path.length - 1; i++) {
            let prev = path[i-1];
            let curr = path[i];
            let next = path[i+1];
            let d1 = getDir(curr, prev);
            let d2 = getDir(curr, next);
            let cell = grid[curr.r][curr.c];
            
            if ((d1 % 2) === (d2 % 2)) {
                cell.type = 'I';
                cell.rotation = d1 % 2 === 0 ? 0 : 1;
            } else {
                cell.type = 'L';
                if ((d1===0 && d2===1) || (d1===1 && d2===0)) cell.rotation = 0;
                if ((d1===1 && d2===2) || (d1===2 && d2===1)) cell.rotation = 1;
                if ((d1===2 && d2===3) || (d1===3 && d2===2)) cell.rotation = 2;
                if ((d1===3 && d2===0) || (d1===0 && d2===3)) cell.rotation = 3;
            }
        }
    }

    function getDir(from, to) {
        if (to.r < from.r) return 0;
        if (to.c > from.c) return 1;
        if (to.r > from.r) return 2;
        if (to.c < from.c) return 3;
        return 0;
    }

    function triggerEarlyFlow() {
        if (isFlowing || gameOver) return;
        clearInterval(timerInterval);
        startWaterFlow();
    }

    function startWaterFlow() {
        isFlowing = true;
        document.getElementById('btn-flow').style.display = 'none';
        document.getElementById('timer').innerText = window.t('flowing');

        let startCell = null;
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                if(grid[r][c].isStart) startCell = grid[r][c];
            }
        }

        let queue = [startCell];
        startCell.wet = true;
        startCell.render();

        flowInterval = setInterval(() => {
            let nextQueue = [];
            let expanded = false;

            for (let cell of queue) {
                let connections = cell.getConnections();
                for (let d = 0; d < 4; d++) {
                    if (connections[d]) {
                        let nr = cell.r + DY[d];
                        let nc = cell.c + DX[d];

                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            let neighbor = grid[nr][nc];
                            if (!neighbor.wet) {
                                let neighborConnections = neighbor.getConnections();
                                let matchingDir = (d + 2) % 4;

                                if (neighborConnections[matchingDir]) {
                                    neighbor.wet = true;
                                    neighbor.render();
                                    nextQueue.push(neighbor);
                                    expanded = true;

                                    if (neighbor.isEnd) {
                                        handleGameEnd(true);
                                        return;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            if (!expanded && !gameOver) {
                handleGameEnd(false);
            }
            queue = nextQueue;
        }, 400); 
    }

    function handleGameEnd(won) {
        gameOver = true;
        clearInterval(flowInterval);
        const statusEl = document.getElementById('status');
        if (won) {
            statusEl.innerHTML = `<div>${window.t('win_msg')}</div><button class="btn-action" onclick="initGame()">${window.t('btn_retry')}</button>`;
        } else {
            statusEl.innerHTML = `<div>${window.t('lose_msg')}</div><button class="btn-action" onclick="initGame()">${window.t('btn_retry')}</button>`;
        }
    }

    window.onload = function() {
        setTimeout(initGame, 50);
    };
</script>
</body>
</html>

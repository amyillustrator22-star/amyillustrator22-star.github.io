<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Mania</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --grid-color: #2c2c2c;
            --pipe-empty: #444;
            --pipe-dry: #888;
            --pipe-wet: #00bcd4;
            --start-color: #4caf50;
            --end-color: #f44336;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #ui-container {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            padding: 0 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #eee;
        }

        #timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
        }

        #status {
            font-size: 1rem;
            height: 1.2rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            width: 90vw;
            max-width: 380px;
            aspect-ratio: 1;
            background-color: var(--grid-color);
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: #333;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
        }

        /* SVG Pipe Styling */
        .cell svg {
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease;
            pointer-events: none;
        }

        .pipe-path {
            fill: none;
            stroke: var(--pipe-dry);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pipe-path.wet {
            stroke: var(--pipe-wet);
        }

        .cell.start .pipe-path { stroke: var(--start-color); }
        .cell.end .pipe-path { stroke: var(--end-color); }
        .cell.start .pipe-path.wet, .cell.end .pipe-path.wet { stroke: var(--pipe-wet); }

        /* Controls */
        #btn-flow {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: var(--pipe-wet);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #btn-flow:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Pipe Mania</h1>
        <div id="timer">Water flows in: 30s</div>
        <div id="status">Tap pipes to rotate them!</div>
    </div>

    <div id="grid-container" id="grid"></div>

    <button id="btn-flow" onclick="triggerEarlyFlow()">Flow Now!</button>

<script>
    const ROWS = 6;
    const COLS = 6;
    let grid = [];
    let startTime = 30;
    let timerInterval = null;
    let flowInterval = null;
    let isFlowing = false;
    let gameOver = false;

    // Directions: 0: Up, 1: Right, 2: Down, 3: Left
    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    // Pipe Types and their connection profiles (Up, Right, Down, Left)
    const PIPE_TYPES = {
        'I': [true, false, true, false],  // Straight
        'L': [true, true, false, false],  // Corner
        'T': [true, true, false, true],   // T-junction
        'X': [true, true, true, true]     // Cross
    };

    class Cell {
        constructor(r, c) {
            this.r = r;
            this.c = c;
            this.isStart = false;
            this.isEnd = false;
            this.type = 'I'; 
            this.rotation = 0; // 0=0°, 1=90°, 2=180°, 3=270°
            this.wet = false;
        }

        // Get actual active connections accounting for current rotation
        getConnections() {
            const base = PIPE_TYPES[this.type];
            let actual = [false, false, false, false];
            for (let i = 0; i < 4; i++) {
                actual[(i + this.rotation) % 4] = base[i];
            }
            return actual;
        }

        rotate() {
            if (this.isStart || this.isEnd || isFlowing || gameOver) return;
            this.rotation = (this.rotation + 1) % 4;
            this.render();
        }

        render() {
            const el = document.getElementById(`cell-${this.r}-${this.c}`);
            if (!el) return;
            
            const svg = el.querySelector('svg');
            if (svg) {
                svg.style.transform = `rotate(${this.rotation * 90}deg)`;
                const paths = svg.querySelectorAll('.pipe-path');
                paths.forEach(p => {
                    if (this.wet) p.classList.add('wet');
                    else p.classList.remove('wet');
                });
            }
        }
    }

    // SVG templates dynamically built based on type
    function getPipeSVG(type) {
        let paths = '';
        if (type === 'I') paths = '<path class="pipe-path" d="M 50 0 L 50 100" />';
        if (type === 'L') paths = '<path class="pipe-path" d="M 50 0 Q 50 50 100 50" />';
        if (type === 'T') paths = '<path class="pipe-path" d="M 50 0 L 50 50 M 0 50 L 100 50" />';
        if (type === 'X') paths = '<path class="pipe-path" d="M 50 0 L 50 100 M 0 50 L 100 50" />';
        return `<svg viewBox="0 0 100 100">${paths}</svg>`;
    }

    function initGame() {
        grid = [];
        isFlowing = false;
        gameOver = false;
        startTime = 30;
        document.getElementById('timer').innerText = `Water flows in: ${startTime}s`;
        document.getElementById('status').innerText = "Tap pipes to rotate them!";
        document.getElementById('btn-flow').style.display = 'inline-block';

        const container = document.getElementById('grid-container');
        container.innerHTML = '';

        // 1. Setup blank grid
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = new Cell(r, c);
            }
        }

        // 2. Define Start and End Points (edges)
        const startR = 0, startC = Math.floor(Math.random() * (COLS - 2)) + 1;
        const endR = ROWS - 1, endC = Math.floor(Math.random() * (COLS - 2)) + 1;

        grid[startR][startC].isStart = true;
        grid[startR][startC].type = 'I'; 
        grid[startR][startC].rotation = 0; // Fixed down-up link

        grid[endR][endC].isEnd = true;
        grid[endR][endC].type = 'I';
        grid[endR][endC].rotation = 0;

        // 3. Generate a non-trivial winding path using backtracking DFS
        let solutionPath = [];
        generatePath(startR, startC, endR, endC, new Set([`${startR},${startC}`]), solutionPath);

        // 4. Transform the solution steps into matching pipe configurations
        applyPathPipes(solutionPath);

        // 5. Fill rest of the map with random configurations & scramble all non-start/end blocks
        const types = ['I', 'L', 'T', 'X'];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cell = grid[r][c];
                if (!solutionPath.some(p => p.r === r && p.c === c)) {
                    cell.type = types[Math.floor(Math.random() * types.length)];
                }
                if (!cell.isStart && !cell.isEnd) {
                    cell.rotation = Math.floor(Math.random() * 4);
                }
            }
        }

        // 6. Draw the elements into DOM
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = grid[r][c];
                const div = document.createElement('div');
                div.id = `cell-${r}-${c}`;
                div.className = `cell${cell.isStart ? ' start' : ''}${cell.isEnd ? ' end' : ''}`;
                div.innerHTML = getPipeSVG(cell.type);
                
                // Native mobile touch + fallback click
                div.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    cell.rotate();
                });
                
                container.appendChild(div);
                cell.render();
            }
        }

        // Countdown initialization
        clearInterval(timerInterval);
        clearInterval(flowInterval);
        timerInterval = setInterval(() => {
            startTime--;
            if (startTime <= 0) {
                clearInterval(timerInterval);
                startWaterFlow();
            } else {
                document.getElementById('timer').innerText = `Water flows in: ${startTime}s`;
            }
        }, 1000);
    }

    // DFS to generate an optimal length path layout
    function generatePath(r, c, er, ec, visited, path) {
        if (r === er && c === ec) {
            path.push({r, c});
            return true;
        }

        let dirs = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
        for (let d of dirs) {
            let nr = r + DY[d];
            let nc = c + DX[d];

            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(`${nr},${nc}`)) {
                visited.add(`${nr},${nc}`);
                path.push({r, c});
                if (generatePath(nr, nc, er, ec, visited, path)) return true;
                path.pop();
                visited.delete(`${nr},${nc}`);
            }
        }
        return false;
    }

    // Convert linear coordinate steps into matching topological pipe templates
    function applyPathPipes(path) {
        for (let i = 1; i < path.length - 1; i++) {
            let prev = path[i-1];
            let curr = path[i];
            let next = path[i+1];

            let d1 = getDir(curr, prev);
            let d2 = getDir(curr, next);

            let cell = grid[curr.r][curr.c];
            
            // Deduce ideal pipe shape
            if ((d1 % 2) === (d2 % 2)) {
                cell.type = 'I';
                cell.rotation = d1 % 2 === 0 ? 0 : 1;
            } else {
                cell.type = 'L';
                if ((d1===0 && d2===1) || (d1===1 && d2===0)) cell.rotation = 0;
                if ((d1===1 && d2===2) || (d1===2 && d2===1)) cell.rotation = 1;
                if ((d1===2 && d2===3) || (d1===3 && d2===2)) cell.rotation = 2;
                if ((d1===3 && d2===0) || (d1===0 && d2===3)) cell.rotation = 3;
            }
        }
    }

    function getDir(from, to) {
        if (to.r < from.r) return 0; // Up
        if (to.c > from.c) return 1; // Right
        if (to.r > from.r) return 2; // Down
        if (to.c < from.c) return 3; // Left
        return 0;
    }

    function triggerEarlyFlow() {
        if (isFlowing || gameOver) return;
        clearInterval(timerInterval);
        startWaterFlow();
    }

    // Sequential simulation logic
    function startWaterFlow() {
        isFlowing = true;
        document.getElementById('btn-flow').style.display = 'none';
        document.getElementById('timer').innerText = "WATER IS FLOWING!";

        // Track active queue paths
        let startCell = null;
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                if(grid[r][c].isStart) startCell = grid[r][c];
            }
        }

        let queue = [startCell];
        startCell.wet = true;
        startCell.render();

        flowInterval = setInterval(() => {
            let nextQueue = [];
            let expanded = false;

            for (let cell of queue) {
                let connections = cell.getConnections();

                for (let d = 0; d < 4; d++) {
                    if (connections[d]) { // Output from current cell
                        let nr = cell.r + DY[d];
                        let nc = cell.c + DX[d];

                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            let neighbor = grid[nr][nc];
                            if (!neighbor.wet) {
                                let neighborConnections = neighbor.getConnections();
                                let matchingDir = (d + 2) % 4; // Inverse reception layout

                                if (neighborConnections[matchingDir]) {
                                    neighbor.wet = true;
                                    neighbor.render();
                                    nextQueue.push(neighbor);
                                    expanded = true;

                                    if (neighbor.isEnd) {
                                        handleGameEnd(true);
                                        return;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            if (!expanded && !gameOver) {
                handleGameEnd(false); // Water trapped or leaked out
            }
            queue = nextQueue;
        }, 400); 
    }

    function handleGameEnd(won) {
        gameOver = true;
        clearInterval(flowInterval);
        if (won) {
            document.getElementById('status').innerHTML = "🎉 Excellent! Path Connected! 🎉<br><button onclick='initGame()' style='margin-top:8px; padding:4px 8px;'>Play Again</button>";
        } else {
            document.getElementById('status').innerHTML = "❌ Game Over! Leak Detected! ❌<br><button onclick='initGame()' style='margin-top:8px; padding:4px 8px;'>Try Again</button>";
        }
    }

    window.onload = initGame;

// Honeypot de seguridad para detectar bots/trampas
    const _win = handleGameEnd;
    handleGameEnd = function(won) {
        // Si alguien intenta llamar a la función sin pasar por el flujo real
        if (!isFlowing && won) {
            console.warn("Intento de manipulación detectado: Flujo de agua no iniciado.");
            return; 
        }
        _win(won);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tortuga Logic - Amy Software</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            overscroll-behavior: none;
        }
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .btn-volver {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .score-info {
            font-size: 1.1rem;
            font-weight: bold;
            color: #22d3ee;
            background: rgba(30, 41, 59, 0.8);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        
        /* CONTENEDOR BLINDADO PARA EL FONDO */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            overflow: hidden;
            background: #020617; /* Fondo negro base */
        }
        
        .fondo-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1; /* Al fondo */
        }

        .error-fondo {
            display: none;
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); border: 2px solid red; color: red;
            padding: 15px; font-weight: bold; text-align: center; z-index: 2;
        }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; /* Por encima de la imagen */
            background: transparent !important; /* TOTALMENTE TRANSPARENTE */
            touch-action: none;
            cursor: pointer;
        }

        .system-validate-field { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

    <div class="system-validate-field" aria-hidden="true">
        <input type="text" id="auth_token_verification" tabindex="-1" autocomplete="off">
    </div>

    <div class="top-bar">
        <a href="juegos.html" class="btn-volver">⬅ VOLVER</a>
        <div class="score-info">Nivel: <span id="txt-nivel" style="color: #eab308;">1</span> | Pts: <span id="txt-score">0</span></div>
    </div>

    <div class="game-container">
        <img src="fondotortuga.jpg" class="fondo-img" id="img-fondo" alt="Fondo Tortuga">
        <div class="error-fondo" id="msg-error">
            ¡ERROR!<br>Linux no encuentra<br>fondotortuga.jpg<br><br>
            <span style="font-size: 0.7rem; color: white;">Revisa si está en minúsculas<br>o si es .jpeg / .png</span>
        </div>
        <canvas id="canvas-tortuga" width="480" height="480"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Control de errores de la imagen
        document.getElementById('img-fondo').onerror = function() {
            document.getElementById('msg-error').style.display = 'block';
        };

        const canvas = document.getElementById('canvas-tortuga');
        const ctx = canvas.getContext('2d');
        const txtNivel = document.getElementById('txt-nivel');
        const txtScore = document.getElementById('txt-score');

        let nivel = 1;
        let score = 0;
        let cables = [];
        let metaX = 0;
        let gameOver = false;
        let bloqueado = false;
        let transicionNivel = false;

        let tortuga = {
            x: 0, y: 0,
            cableIdx: -1,
            nodoActual: 0,
            t: 0,
            estado: 'espera',
            velocidad: 0.06
        };

        let securityTriggered = false;
        window.turtle_secure_val = 0;
        function checkIntegrity() {
            if (document.getElementById('auth_token_verification').value !== "" || window.turtle_secure_val !== 0) {
                securityTriggered = true;
            }
        }

        // --- LÓGICA 2: ÁNGULOS RECTOS (AMIDAKUJI) MANTENIDA AL 100% ---
        function generarCircuito() {
            cables = [];
            bloqueado = false;
            gameOver = false;
            tortuga.estado = 'espera';
            tortuga.nodoActual = 0;
            tortuga.t = 0;

            let numCables = Math.min(3 + Math.floor((nivel - 1) / 3), 5); 
            let espaciado = 320 / (numCables - 1);
            
            let xEntradas = [];
            let xSalidas = [];
            for (let i = 0; i < numCables; i++) {
                xEntradas.push(80 + i * espaciado);
                xSalidas.push(80 + i * espaciado);
            }
            xSalidas.sort(() => Math.random() - 0.5);

            let indexCorrecto = Math.floor(Math.random() * numCables);
            metaX = xSalidas[indexCorrecto];

            for (let i = 0; i < numCables; i++) {
                let nodos = [];
                let xIn = xEntradas[i];
                let xOut = xSalidas[i];

                nodos.push({ x: xIn, y: 430 }); // Inicio abajo
                
                let yCodo1 = 330 - (i * 25);
                let yCodo2 = 160 + (i * 25);
                let xCruzeIntermedio = 90 + Math.random() * 300;

                // Codos ortogonales obligatorios
                nodos.push({ x: xIn, y: yCodo1 });
                nodos.push({ x: xCruzeIntermedio, y: yCodo1 });
                nodos.push({ x: xCruzeIntermedio, y: yCodo2 });
                nodos.push({ x: xOut, y: yCodo2 });

                let esGanador = (i === indexCorrecto);
                if (esGanador) {
                    nodos.push({ x: xOut, y: 45 }); // Final
                } else {
                    // Cable cortado ciego
                    nodos.push({ x: xOut, y: 110 });
                    nodos.push({ x: xOut + (Math.random() > 0.5 ? 20 : -20), y: 110 });
                }

                cables.push({
                    id: i,
                    color: '#00ff66', // Todos verdes
                    nodos: nodos,
                    esGanador: esGanador
                });
            }
        }

        async function registrarRecord() {
            if (securityTriggered) return;
            const alias = prompt(`💀 FIN DE LA PARTIDA\nPuntuación: ${score} pts.\nIntroduce tu nombre para la tabla mundial:`);
            if (alias && alias.trim() !== "") {
                try {
                    await addDoc(collection(db, "scores_arcade"), {
                        game: "tortuga",
                        player: alias.trim().substring(0, 12),
                        score: parseInt(score),
                        country: "🇪🇸",
                        date: new Date().toISOString()
                    });
                } catch (e) { console.error(e); }
            }
            window.location.href = "juegos.html";
        }

        function actualizarMecánicas() {
            if (gameOver || securityTriggered || tortuga.estado === 'espera' || transicionNivel) return;

            let cable = cables[tortuga.cableIdx];
            let p1 = cable.nodos[tortuga.nodoActual];
            let p2 = cable.nodos[tortuga.nodoActual + 1];

            if (!p2) {
                if (cable.esGanador) {
                    tortuga.estado = 'exito';
                    score += 10; 
                    txtScore.innerText = score;
                    transicionNivel = true;
                    
                    setTimeout(() => {
                        nivel++;
                        txtNivel.innerText = nivel;
                        generarCircuito();
                        transicionNivel = false;
                    }, 1200);
                } else {
                    tortuga.estado = 'error';
                    gameOver = true;
                    setTimeout(registrarRecord, 1500);
                }
                return;
            }

            tortuga.x = p1.x + (p2.x - p1.x) * tortuga.t;
            tortuga.y = p1.y + (p2.y - p1.y) * tortuga.t;

            let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            tortuga.t += (tortuga.velocidad * 100) / dist; 

            if (tortuga.t >= 1) {
                tortuga.t = 0;
                tortuga.nodoActual++;
                tortuga.x = p2.x;
                tortuga.y = p2.y;
            }
        }

        function renderingLoop() {
            checkIntegrity();
            if (securityTriggered) return;

            // EL CANVAS SE LIMPIA POR COMPLETO PARA DEJAR VER LA IMAGEN HTML QUE HAY DEBAJO
            ctx.clearRect(0, 0, 480, 480);

            // Filtro oscuro para que los cables destaquen (Opcional, pero recomendado)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, 480, 480);

            if (transicionNivel) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)'; ctx.fillRect(0, 0, 480, 480);
                ctx.fillStyle = '#00ff66'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("¡BUEN CAMINO! 🐢", 240, 210);
                ctx.fillStyle = 'white'; ctx.font = '16px monospace';
                ctx.fillText("Cargando siguiente circuito...", 240, 250);
                return;
            }

            // Meta
            ctx.fillStyle = 'rgba(34, 211, 238, 0.4)';
            ctx.shadowBlur = 15; ctx.shadowColor = '#22d3ee';
            ctx.beginPath(); ctx.arc(metaX, 40, 22, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText("🏆", metaX, 40);

            // Cables
            cables.forEach(c => {
                ctx.beginPath();
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 8; ctx.shadowColor = '#00ff66';
                
                ctx.moveTo(c.nodos[0].x, c.nodos[0].y);
                for (let n = 1; n < c.nodos.length; n++) {
                    ctx.lineTo(c.nodos[n].x, c.nodos[n].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.fillStyle = c.color;
                ctx.arc(c.nodos[0].x, c.nodos[0].y, 14, 0, Math.PI * 2);
                ctx.fill();
            });

            // Tortuga
            if (tortuga.estado === 'moviendo' || tortuga.estado === 'error' || tortuga.estado === 'exito') {
                ctx.font = "32px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("🐢", tortuga.x, tortuga.y);
                
                if (tortuga.estado === 'error') {
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 36px monospace';
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444';
                    ctx.fillText("?", tortuga.x, tortuga.y - 32);
                    ctx.shadowBlur = 0;
                }
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.fillRect(0, 0, 480, 480);
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
                ctx.fillText("CABLE SIN SALIDA", 240, 220);
            }

            actualizarMecánicas();
            requestAnimationFrame(renderingLoop);
        }

        function intentodesplazar(clientX, clientY) {
            if (bloqueado || gameOver || tortuga.estado !== 'espera' || transicionNivel) return;
            const rect = canvas.getBoundingClientRect();
            const canvasX = (clientX - rect.left) * (480 / canvas.clientWidth);
            const canvasY = (clientY - rect.top) * (480 / canvas.clientHeight);

            cables.forEach((c, idx) => {
                let dist = Math.hypot(canvasX - c.nodos[0].x, canvasY - c.nodos[0].y);
                if (dist < 32) {
                    bloqueado = true;
                    tortuga.cableIdx = idx; tortuga.nodoActual = 0; tortuga.t = 0;
                    tortuga.x = c.nodos[0].x; tortuga.y = c.nodos[0].y;
                    tortuga.estado = 'moviendo';
                }
            });
        }

        canvas.addEventListener('mousedown', e => intentodesplazar(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            intentodesplazar(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        generarCircuito();
        renderingLoop();
    </script>
</body>
</html>

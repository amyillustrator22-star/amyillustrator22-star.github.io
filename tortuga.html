<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tortuga Cables - Amy Software</title>
    <style>
        body { background: #0f172a; color: white; font-family: monospace; display: flex; flex-direction: column; align-items: center; min-height: 100dvh; margin: 0; padding-top: max(20px, env(safe-area-inset-top)); box-sizing: border-box; overscroll-behavior: none; }
        .btn-volver { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #f87171; padding: 6px 16px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 0.9rem; margin-bottom: 10px; }
        canvas { background: #020617; border: 4px solid #334155; border-radius: 16px; width: 100% !important; max-width: 480px !important; height: auto !important; aspect-ratio: 1 / 1 !important; touch-action: none; }
        .system-validate-field { position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <div class="system-validate-field"><input type="text" id="auth_token_verification"></div>
    <a href="juegos.html" class="btn-volver">⬅ VOLVER AL MENÚ</a>
    <canvas id="canvas-tortuga" width="480" height="480"></canvas>

    <script type="module">
        const canvas = document.getElementById('canvas-tortuga');
        const ctx = canvas.getContext('2d');
        
        let nivel = 1;
        let cables = [];
        let tortuga = { x: 0, y: 0, activo: false, cableIndex: -1, progreso: 0, estado: 'espera' }; // espera, moviendo, gameOver, fin
        
        function generarNivel() {
            cables = [];
            let num = 2 + nivel;
            let salidaCorrecta = Math.floor(Math.random() * num);
            for(let i=0; i<num; i++) {
                cables.push({
                    id: i,
                    color: i === salidaCorrecta ? '#22d3ee' : '#475569',
                    esCorrecto: i === salidaCorrecta,
                    cp1: { x: 240, y: 50 + (i * 400/num) },
                    cp2: { x: 240, y: 50 + (i * 400/num) }
                });
            }
            tortuga.estado = 'espera';
        }

        function dibujarCurva(c, idx) {
            ctx.beginPath();
            ctx.strokeStyle = c.color;
            ctx.lineWidth = 6;
            ctx.moveTo(40, 50 + (idx * 400/(cables.length)));
            ctx.bezierCurveTo(c.cp1.x, c.cp1.y, c.cp2.x, c.cp2.y, 440, 50 + (idx * 400/(cables.length)));
            ctx.stroke();
        }

        function animar() {
            ctx.clearRect(0,0, 480, 480);
            cables.forEach((c, i) => dibujarCurva(c, i));

            if(tortuga.activo) {
                let c = cables[tortuga.cableIndex];
                let y_base = 50 + (tortuga.cableIndex * 400/cables.length);
                // Dibujar tortuga
                ctx.font = "30px Arial";
                ctx.fillText("🐢", 40 + tortuga.progreso * 400, y_base);
                
                tortuga.progreso += 0.01;
                if(tortuga.progreso >= 1) {
                    if(c.esCorrecto) { tortuga.estado = 'fin'; nivel++; setTimeout(generarNivel, 1000); }
                    else { tortuga.estado = 'gameOver'; }
                }
            }

            if(tortuga.estado === 'gameOver') {
                ctx.fillStyle = "white"; ctx.font = "bold 40px monospace";
                ctx.fillText("?", 40 + tortuga.progreso * 400, 50 + (tortuga.cableIndex * 400/cables.length) - 20);
                ctx.fillText("GAME OVER", 240, 240);
            }
            requestAnimationFrame(animar);
        }

        canvas.addEventListener('mousedown', e => {
            if(tortuga.estado !== 'espera') return;
            const rect = canvas.getBoundingClientRect();
            const y = (e.clientY - rect.top) * (480/canvas.clientHeight);
            cables.forEach((c, i) => {
                let cableY = 50 + (i * 400/cables.length);
                if(Math.abs(y - cableY) < 30) {
                    tortuga.activo = true; tortuga.cableIndex = i; tortuga.progreso = 0;
                }
            });
        });

        generarNivel();
        animar();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tortuga Logic - Amy Software Pro</title>
    <style>
        body { background: #0f172a; color: white; font-family: monospace; display: flex; flex-direction: column; align-items: center; min-height: 100dvh; margin: 0; padding-top: max(20px, env(safe-area-inset-top)); box-sizing: border-box; overscroll-behavior: none; }
        .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: flex-start; margin-bottom: 8px; padding: 0 10px; box-sizing: border-box; }
        .btn-volver { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #f87171; padding: 6px 16px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        canvas { border: 4px solid #334155; border-radius: 16px; width: 100% !important; max-width: 480px !important; height: auto !important; aspect-ratio: 1 / 1 !important; touch-action: none; cursor: pointer; }
        .system-validate-field { position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <div class="system-validate-field"><input type="text" id="auth_token_verification"></div>
    <div class="top-bar"><a href="juegos.html" class="btn-volver">⬅ VOLVER</a></div>
    <canvas id="canvas-tortuga" width="480" height="480"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE MANTENIDA
        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById('canvas-tortuga');
        const ctx = canvas.getContext('2d');

        // 👇 CARGA DE FONDO DIRECTA Y BLINDADA EN JAVASCRIPT 👇
        const imgFondo = new Image();
        imgFondo.src = 'fondotortuga.jpg'; // Asegúrate de que el nombre coincide EXACTAMENTE en tu Linux Mint
        
        let fondoCargado = false;
        imgFondo.onload = () => { fondoCargado = true; };
        imgFondo.onerror = () => { console.error("ERROR: No se pudo cargar fondotortuga.jpg. Asegúrate de que el archivo existe y el nombre es correcto (minúsculas)."); };

        let nivel = 1;
        let score = 0;
        let cables = [];
        let gameOver = false;
        let tortuga = { x: 0, y: 0, activo: false, cableIdx: -1, progreso: 0, estado: 'espera' }; 

        // VOLVEMOS A LA LÓGICA DE CURVAS DE BÉZIER SIMPLES QUE TE GUSTABA
        function generarNivel() {
            cables = [];
            let num = 2 + nivel; // Empieza en 3, sube a 4, 5...
            let salidaCorrecta = Math.floor(Math.random() * num); // Uno es la salida correcta

            for (let i = 0; i < num; i++) {
                // Definir puntos de inicio (Izq) y destino (Der) espaciados uniformemente
                let y_inicio = 50 + (i * 400 / (num - 1));
                let y_fin = 50 + (i * 400 / (num - 1));
                
                // Crear puntos de control aleatorios para la curva (esto los entrelaza visualmente)
                let cp1x = 100 + Math.random() * 280;
                let cp1y = 50 + Math.random() * 400;
                let cp2x = 100 + Math.random() * 280;
                let cp2y = 50 + Math.random() * 400;

                cables.push({
                    id: i,
                    // Color neón fijo para todos para que sea un reto visual
                    color: '#00ff66',
                    esCorrecto: i === salidaCorrecta,
                    inicio: { x: 40, y: y_inicio },
                    cp1: { x: cp1x, y: cp1y },
                    cp2: { x: cp2x, y: cp2y },
                    fin: { x: 440, y: y_fin }
                });
            }
            tortuga.estado = 'espera';
        }

        // Fórmula Cubic Bezier para un progreso 't' (0 a 1)
        function getBezierPoint(p0, p1, p2, p3, t) {
            const cx = 3 * (p1.x - p0.x);
            const bx = 3 * (p2.x - p1.x) - cx;
            const ax = p3.x - p0.x - cx - bx;

            const cy = 3 * (p1.y - p0.y);
            const by = 3 * (p2.y - p1.y) - cy;
            const ay = p3.y - p0.y - cy - by;

            const x = (ax * Math.pow(t, 3)) + (bx * Math.pow(t, 2)) + (cx * t) + p0.x;
            const y = (ay * Math.pow(t, 3)) + (by * Math.pow(t, 2)) + (cy * t) + p0.y;
            return { x, y };
        }

        async function registrarRecord() {
            if (securityTriggered) return;
            const alias = prompt(`🐢 PARTIDA TERMINADA\nNivel: ${nivel}\nPuntuación: ${score}\n\nIntroduce tu nombre para la clasificación:`);
            if (alias && alias.trim() !== "") {
                try {
                    await addDoc(collection(db, "scores_arcade"), {
                        game: "tortuga",
                        player: alias.trim().substring(0, 12),
                        score: parseInt(score),
                        date: new Date().toISOString()
                    });
                } catch (e) { console.error(e); }
            }
            window.location.href = "juegos.html";
        }

        function actualizar() {
            if (securityTriggered || gameOver || tortuga.estado !== 'espera') return;

            if(tortuga.activo) {
                tortuga.progreso += 0.005; // Velocidad de la tortuga
                let cable = cables[tortuga.cableIdx];
                
                // Mover tortuga por la curva de Bezier
                let punto = getBezierPoint(cable.inicio, cable.cp1, cable.cp2, cable.fin, tortuga.progreso);
                tortuga.x = punto.x;
                tortuga.y = punto.y;

                if(tortuga.progreso >= 1) {
                    tortuga.activo = false;
                    if(cable.esCorrecto) {
                        tortuga.estado = 'espera';
                        score += 100 * nivel;
                        nivel++;
                        generarNivel();
                    } else {
                        tortuga.estado = 'error';
                        gameOver = true;
                        setTimeout(registrarRecord, 1500);
                    }
                }
            }
        }

        function animar() {
            // 1. DIBUJAR FONDO DIRECTAMENTE EN EL CANVAS (Si cargó)
            if (fondoCargado) {
                ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
                // Capa oscura translúcida opcional para visibilidad de cables
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#020617'; ctx.fillRect(0,0, canvas.width, canvas.height);
            }

            // 2. DIBUJAR CABLES (Volvemos a las curvas suaves)
            cables.forEach(c => {
                ctx.beginPath();
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 10; ctx.shadowColor = '#00ff66';
                
                ctx.moveTo(c.inicio.x, c.inicio.y);
                ctx.bezierCurveTo(c.cp1.x, c.cp1.y, c.cp2.x, c.cp2.y, c.fin.x, c.fin.y);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Círculos de entrada (Abajo)
                ctx.fillStyle = c.color;
                ctx.beginPath(); ctx.arc(c.inicio.x, c.inicio.y, 14, 0, Math.PI * 2); ctx.fill();
            });

            // 3. DIBUJAR TORTUGA
            if (tortuga.activo || tortuga.estado === 'error') {
                ctx.font = "32px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("🐢", tortuga.x, tortuga.y);
                
                if (tortuga.estado === 'error') {
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 36px monospace'; ctx.fillText("?", tortuga.x, tortuga.y - 30);
                }
            }

            // 4. TEXTO INFO
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left';
            ctx.fillText(`Nivel: ${nivel}`, 15, 30);
            ctx.textAlign = 'right';
            ctx.fillText(`Score: ${score}`, 465, 30);

            // 5. GAME OVER SCREEN
            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 40px monospace'; ctx.textAlign = 'center';
                ctx.fillText("¡CAMINO ERRÓNEO!", 240, 220);
                ctx.fillStyle = 'white'; ctx.font = '16px monospace'; ctx.fillText("La tortuga ha fallado el cable.", 240, 260);
            }

            actualizar();
            requestAnimationFrame(animar);
        }

        let securityTriggered = false; // Honeypot kept
        canvas.addEventListener('mousedown', e => {
            if(securityTriggered || gameOver || tortuga.estado !== 'espera' || tortuga.activo) return;
            const rect = canvas.getBoundingClientRect();
            const canvasX = (e.clientX - rect.left) * (480 / canvas.clientWidth);
            const canvasY = (e.clientY - rect.top) * (480 / canvas.clientHeight);

            cables.forEach((c, idx) => {
                // Comprobamos si ha tocado el círculo inicial
                let dist = Math.hypot(canvasX - c.inicio.x, canvasY - c.inicio.y);
                if (dist < 30) {
                    tortuga.activo = true; tortuga.cableIdx = idx; tortuga.progreso = 0;
                    tortuga.x = c.inicio.x; tortuga.y = c.inicio.y;
                }
            });
        });

        generarNivel();
        animar();
    </script>
</body>
</html>

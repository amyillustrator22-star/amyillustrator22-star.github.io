<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5491883632835608" crossorigin="anonymous"></script>
    <script data-goatcounter="https://amysoftware.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tortuga Sprint Amidakuji - Amy Software</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            overscroll-behavior: none;
        }
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .btn-volver {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .score-info {
            font-size: 1.1rem;
            font-weight: bold;
            color: #22d3ee;
            background: rgba(30, 41, 59, 0.8);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        canvas {
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            width: 100% !important;
            max-width: 480px !important;
            height: auto !important;
            aspect-ratio: 1 / 1 !important;
            object-fit: contain;
            touch-action: none;
            cursor: pointer;
        }
        .system-validate-field { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

    <div class="system-validate-field" aria-hidden="true">
        <input type="text" id="auth_token_verification" tabindex="-1" autocomplete="off">
    </div>

    <div class="top-bar">
        <a href="juegos.html" class="btn-volver">⬅ VOLVER</a>
        <div class="score-info">Nivel: <span id="txt-nivel" style="color: #eab308;">1</span> | Pts: <span id="txt-score">0</span></div>
    </div>

    <canvas id="canvas-tortuga" width="480" height="480"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcStr-j9DH-2HfQatHiZioxJNmmvE74sA",
            authDomain: "vibezmatch-91c6d.firebaseapp.com",
            projectId: "vibezmatch-91c6d",
            storageBucket: "vibezmatch-91c6d.appspot.com",
            messagingSenderId: "645008717503",
            appId: "1:645008717503:web:f1dfb07ddfcee571a8f80a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById('canvas-tortuga');
        const ctx = canvas.getContext('2d');
        const txtNivel = document.getElementById('txt-nivel');
        const txtScore = document.getElementById('txt-score');

        const imgFondo = new Image();
        imgFondo.src = 'fondotortuga.jpg';
        let fondoCargado = false;
        imgFondo.onload = () => { fondoCargado = true; };
        imgFondo.onerror = () => { fondoCargado = false; };

        let nivel = 1;
        let score = 0;
        let numLineas = 4;
        let indexGanadorArriba = 0; 
        let xStart = [];
        let puentesVisuales = [];
        let pathsLógicos = []; 
        
        let gameOver = false;
        let bloqueado = false;
        let transicionNivel = false;

        let tortuga = { x: 0, y: 0, pathIdx: -1, nodoActual: 0, t: 0, estado: 'espera', velocidad: 0.08 };

        let securityTriggered = false;
        window.turtle_secure_val = 0;
        function checkIntegrity() {
            if (document.getElementById('auth_token_verification').value !== "" || window.turtle_secure_val !== 0) securityTriggered = true;
        }

        function generarAmidakuji() {
            bloqueado = false;
            gameOver = false;
            tortuga.estado = 'espera';
            puentesVisuales = [];
            pathsLógicos = [];

            numLineas = Math.min(3 + Math.floor((nivel - 1) / 2), 6);
            let espaciado = 340 / (numLineas - 1);
            xStart = [];
            for (let i = 0; i < numLineas; i++) {
                xStart.push(70 + i * espaciado);
            }

            let ySlots = [120, 170, 220, 270, 320, 370];
            ySlots.forEach(y => {
                if (Math.random() > 0.15) {
                    let col = Math.floor(Math.random() * (numLineas - 1));
                    puentesVisuales.push({ y: y, col: col });
                }
            });
            puentesVisuales.sort((a, b) => a.y - b.y);

            indexGanadorArriba = Math.floor(Math.random() * numLineas);

            for (let i = 0; i < numLineas; i++) {
                let nodos = [{ x: xStart[i], y: 410 }];
                let colActual = i;

                let puentesSimulacion = JSON.parse(JSON.stringify(puentesVisuales)).sort((a, b) => b.y - a.y);
                puentesSimulacion.forEach(p => {
                    if (p.col === colActual) {
                        nodos.push({ x: xStart[colActual], y: p.y }); 
                        colActual++; 
                        nodos.push({ x: xStart[colActual], y: p.y }); 
                    } else if (p.col === colActual - 1) {
                        nodos.push({ x: xStart[colActual], y: p.y }); 
                        colActual--; 
                        nodos.push({ x: xStart[colActual], y: p.y }); 
                    }
                });

                nodos.push({ x: xStart[colActual], y: 70 });

                let llegaAMeta = (colActual === indexGanadorArriba);

                pathsLógicos.push({
                    startX: xStart[i], 
                    startY: 410,       
                    nodos: nodos,
                    esGanador: llegaAMeta
                });
            }
        }

        async function registrarRecord() {
            if (securityTriggered) return;
            const alias = prompt(`💀 JUEGO TERMINADO\nPuntuación: ${score} pts.\nIntroduce tu nombre para la clasificación:`);
            if (alias && alias.trim() !== "") {
                try {
                    await addDoc(collection(db, "scores_arcade"), { game: "tortugasprint", player: alias.trim().substring(0, 12), score: parseInt(score), country: "🇪🇸", date: new Date().toISOString() });
                } catch (e) { console.error(e); }
            }
            window.location.href = "juegos.html";
        }

        function actualizar() {
            if (gameOver || securityTriggered || tortuga.estado !== 'moviendo') return;

            let path = pathsLógicos[tortuga.pathIdx];
            let p1 = path.nodos[tortuga.nodoActual];
            let p2 = path.nodos[tortuga.nodoActual + 1];

            if (!p2) {
                if (path.esGanador) {
                    tortuga.estado = 'espera';
                    score += 10;
                    nivel++;
                    txtNivel.innerText = nivel;
                    txtScore.innerText = score;
                    transicionNivel = true;
                    setTimeout(() => {
                        generarAmidakuji();
                        transicionNivel = false;
                    }, 1000);
                } else {
                    tortuga.estado = 'error';
                    gameOver = true;
                    setTimeout(registrarRecord, 1500);
                }
                return;
            }

            tortuga.x = p1.x + (p2.x - p1.x) * tortuga.t;
            tortuga.y = p1.y + (p2.y - p1.y) * tortuga.t;

            let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            tortuga.t += (tortuga.velocidad * 100) / dist;

            if (tortuga.t >= 1) {
                tortuga.t = 0;
                tortuga.nodoActual++;
                tortuga.x = p2.x;
                tortuga.y = p2.y;
            }
        }

        function renderingLoop() {
            checkIntegrity();
            if (securityTriggered) return;

            ctx.clearRect(0, 0, 480, 480);

            // FONDO
            if (fondoCargado) {
                ctx.drawImage(imgFondo, 0, 0, 480, 480);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, 480, 480);
            } else {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 480, 480);
            }

            // PANTALLA DE TRANSICIÓN (FIX: ¡Ya no rompe el bucle!)
            if (transicionNivel) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.fillRect(0, 0, 480, 480);
                ctx.fillStyle = '#00ff66'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("¡CORRECTO! 🐢", 240, 240);
                requestAnimationFrame(renderingLoop); // Mantiene vivo el bucle principal
                return;
            }

            // CUADRÍCULA LIMPIA Y NEÓN
            ctx.beginPath();
            ctx.strokeStyle = '#00ff66'; 
            ctx.lineWidth = 5;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ff66';

            for (let i = 0; i < numLineas; i++) {
                ctx.moveTo(xStart[i], 70);
                ctx.lineTo(xStart[i], 410);
            }
            puentesVisuales.forEach(p => {
                ctx.moveTo(xStart[p.col], p.y);
                ctx.lineTo(xStart[p.col + 1], p.y);
            });
            ctx.stroke();
            ctx.shadowBlur = 0; 

            // BOTONES DE INICIO (ABAJO)
            for (let i = 0; i < numLineas; i++) {
                ctx.fillStyle = '#e2e8f0'; 
                ctx.fillRect(xStart[i] - 10, 400, 20, 20); 
            }

            // COPA GANADORA (ARRIBA) - SOLO DONDE CORRESPONDE
            for (let i = 0; i < numLineas; i++) {
                ctx.font = "24px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                if (i === indexGanadorArriba) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                    ctx.beginPath(); ctx.arc(xStart[i], 50, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.fillText("🏆", xStart[i], 52); 
                }
            }

            // DIBUJAR TORTUGA
            if (tortuga.estado === 'moviendo' || tortuga.estado === 'error') {
                ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("🐢", tortuga.x, tortuga.y); 
                if (tortuga.estado === 'error') {
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 36px monospace';
                    ctx.fillText("?", tortuga.x, tortuga.y - 25);
                }
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.fillRect(0, 0, 480, 480);
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("GAME OVER", 240, 240);
            }

            actualizar();
            requestAnimationFrame(renderingLoop);
        }

        function interactuar(clientX, clientY) {
            if (bloqueado || gameOver || tortuga.estado !== 'espera') return;
            const rect = canvas.getBoundingClientRect();
            const canvasX = (clientX - rect.left) * (480 / canvas.clientWidth);
            const canvasY = (clientY - rect.top) * (480 / canvas.clientHeight);

            pathsLógicos.forEach((path, idx) => {
                let dist = Math.hypot(canvasX - path.startX, canvasY - 410); 
                if (dist < 30) {
                    bloqueado = true;
                    tortuga.pathIdx = idx; tortuga.nodoActual = 0; tortuga.t = 0;
                    tortuga.x = path.nodos[0].x; tortuga.y = path.nodos[0].y; 
                    tortuga.estado = 'moviendo';
                }
            });
        }

        canvas.addEventListener('mousedown', e => interactuar(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => { e.preventDefault(); interactuar(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        generarAmidakuji();
        renderingLoop();
    </script>
</body>
</html>
